<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Настройки редактора DSLKit: тема, редактор и холст." />
    <title>Настройки редактора — DSLKit</title>
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="app-page app-page--settings">
    <a class="skip-link" href="#main">Перейти к основному содержимому</a>

    <header class="app-topbar">
      <a class="app-topbar__logo" href="../index.html">
        <img class="app-topbar__logo-image" src="../images/logo.svg" alt="" width="24" height="24" />
        <span class="app-topbar__logo-text">DSLKit</span>
      </a>
      <div class="app-topbar__search" role="search">
        <label class="visually-hidden" for="app-search">Поиск диаграмм</label>
        <input id="app-search" class="app-topbar__search-input" type="search" name="search" placeholder="Поиск диаграмм… Ctrl+K" autocomplete="off" />
        <button type="button" class="app-topbar__search-button" aria-label="Найти">
          <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="9" cy="9" r="5" />
            <path d="M13 13l4 4" />
          </svg>
        </button>
      </div>
      <a class="app-topbar__new" href="welcome.html">
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M10 4v12M4 10h12" />
        </svg>
        <span>Новая диаграмма</span>
      </a>
      <a class="header__lang" href="../en/app/settings.html" hreflang="en" lang="en">English</a>
      <button type="button" class="app-topbar__avatar" aria-label="Профиль">
        <span aria-hidden="true">KX</span>
      </button>
    </header>

    <nav class="app-nav" aria-label="Разделы приложения">
      <ul class="app-nav__list">
        <li class="app-nav__item">
          <a class="app-nav__link" href="dashboard.html">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 10l7-6 7 6M5 9v7h10V9" />
            </svg>
            <span>Мои проекты</span>
          </a>
        </li>
        <li class="app-nav__item">
          <a class="app-nav__link" href="welcome.html">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 4h14v12H3zM3 8h14M8 8v8" />
            </svg>
            <span>Шаблоны</span>
          </a>
        </li>
        <li class="app-nav__item">
          <button type="button" class="app-nav__link">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="7" cy="7" r="3" />
              <path d="M2 16c0-3 2-5 5-5s5 2 5 5M14 4a3 3 0 010 6M16 16c0-2-1-4-3-5" />
            </svg>
            <span>Общие</span>
          </button>
        </li>
        <li class="app-nav__item">
          <button type="button" class="app-nav__link">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10" />
            </svg>
            <span>Корзина</span>
          </button>
        </li>
      </ul>
    </nav>
    <div class="app-nav__quota">
      <p class="app-nav__quota-text" id="quota-text">Бета: 3 из 5 диаграмм в день</p>
      <progress class="app-nav__progress" aria-labelledby="quota-text" max="5" value="3">3 из 5</progress>
      <p class="app-nav__quota-plan">Pro — без лимитов</p>
    </div>

    <main id="main" class="settings">
      <nav class="settings-nav" aria-label="Разделы настроек">
        <ul class="settings-nav__list">
          <li class="settings-nav__item">
            <a class="settings-nav__link" href="#editor-settings" aria-current="true">
              <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M7 6l-4 4 4 4M13 6l4 4-4 4" />
              </svg>
              <span>Редактор</span>
            </a>
          </li>
          <li class="settings-nav__item">
            <button type="button" class="settings-nav__link">
              <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 4h14v12H3zM3 8h14M8 8v8" />
              </svg>
              <span>Холст</span>
            </button>
          </li>
          <li class="settings-nav__item">
            <a class="settings-nav__link" href="#theme">
              <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="10" cy="10" r="3" />
                <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.5 4.5l1.4 1.4M14.1 14.1l1.4 1.4M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4" />
              </svg>
              <span>Тема</span>
            </a>
          </li>
          <li class="settings-nav__item">
            <button type="button" class="settings-nav__link">
              <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="10" cy="10" r="3" />
                <path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.5 4.5l2 2M13.5 13.5l2 2M15.5 4.5l-2 2M6.5 13.5l-2 2" />
              </svg>
              <span>Горячие клавиши</span>
            </button>
          </li>
          <li class="settings-nav__item">
            <button type="button" class="settings-nav__link">
              <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6z" />
              </svg>
              <span>AI и интеграции</span>
            </button>
          </li>
          <li class="settings-nav__item">
            <button type="button" class="settings-nav__link">
              <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="7" cy="7" r="3" />
                <path d="M2 16c0-3 2-5 5-5s5 2 5 5M14 4a3 3 0 010 6M16 16c0-2-1-4-3-5" />
              </svg>
              <span>Аккаунт и тариф</span>
            </button>
          </li>
        </ul>
      </nav>

      <div class="settings__content">
        <h1 class="settings__title">Настройки · Редактор</h1>

        <section id="editor-settings" class="settings-group" aria-label="Редактор">
          <ul class="settings-list">
            <li class="settings-row">
              <label class="settings-row__label" for="code-font-size">Размер шрифта кода</label>
              <select id="code-font-size" class="settings-row__select" name="code-font-size">
                <option value="13" selected>13 px</option>
              </select>
            </li>
            <li class="settings-row">
              <label class="settings-row__label" for="line-numbers">Номера строк</label>
              <input id="line-numbers" class="switch__input" type="checkbox" role="switch" name="line-numbers" checked />
            </li>
            <li class="settings-row">
              <label class="settings-row__label" for="line-wrap">Перенос строк</label>
              <input id="line-wrap" class="switch__input" type="checkbox" role="switch" name="line-wrap" />
            </li>
            <li class="settings-row">
              <label class="settings-row__label" for="autocomplete">Автодополнение</label>
              <select id="autocomplete" class="settings-row__select" name="autocomplete">
                <option value="first-char" selected>По первому символу</option>
              </select>
            </li>
            <li class="settings-row">
              <label class="settings-row__label" for="autosave">Автосохранение</label>
              <input id="autosave" class="switch__input" type="checkbox" role="switch" name="autosave" checked />
            </li>
            <li class="settings-row">
              <label class="settings-row__label" for="canvas-grid">Сетка холста</label>
              <select id="canvas-grid" class="settings-row__select" name="canvas-grid">
                <option value="dots" selected>Точки</option>
              </select>
            </li>
            <li class="settings-row">
              <label class="settings-row__label" for="diagram-engine">Движок генерации диаграмм</label>
              <select id="diagram-engine" class="settings-row__select" name="diagram-engine">
                <option value="graphviz" selected>Kroki · Graphviz</option>
                <option value="mermaid">Kroki · Mermaid</option>
                <option value="plantuml">Kroki · PlantUML</option>
                <option value="local">Собственный движок (в браузере)</option>
              </select>
            </li>
            <li class="settings-row">
              <label class="settings-row__label" for="guides">Направляющие и отступы</label>
              <input id="guides" class="switch__input" type="checkbox" role="switch" name="guides" checked />
            </li>
          </ul>
        </section>

        <div id="theme" class="settings-group">
          <fieldset class="theme-picker">
            <legend class="settings-group__title">Тема</legend>
            <div class="theme-options">
              <div class="theme-option">
                <input id="theme-light" class="theme-option__input" type="radio" name="theme" value="light" checked />
                <label class="theme-option__label" for="theme-light">
                  <span class="theme-option__preview theme-option__preview--light" aria-hidden="true"></span>
                  <span class="theme-option__name">Светлая</span>
                </label>
              </div>
              <div class="theme-option">
                <input id="theme-dark" class="theme-option__input" type="radio" name="theme" value="dark" />
                <label class="theme-option__label" for="theme-dark">
                  <span class="theme-option__preview theme-option__preview--dark" aria-hidden="true"></span>
                  <span class="theme-option__name">Тёмная</span>
                </label>
              </div>
              <div class="theme-option">
                <input id="theme-auto" class="theme-option__input" type="radio" name="theme" value="auto" />
                <label class="theme-option__label" for="theme-auto">
                  <span class="theme-option__preview theme-option__preview--auto" aria-hidden="true"></span>
                  <span class="theme-option__name">Авто</span>
                </label>
              </div>
            </div>
          </fieldset>
        </div>
      </div>
    </main>
    <script type="module" src="../js/script.js"></script>
  </body>
</html>
