<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Проекты DSLKit: фильтр, поиск и сортировка диаграмм." />
    <title>Мои проекты — DSLKit</title>
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="app-page app-page--dashboard">
    <a class="skip-link" href="#main">Перейти к основному содержимому</a>

    <header class="app-topbar">
      <a class="app-topbar__logo" href="../index.html">
        <img class="app-topbar__logo-image" src="../images/logo.svg" alt="" width="24" height="24" />
        <span class="app-topbar__logo-text">DSLKit</span>
      </a>
      <div class="app-topbar__search" role="search">
        <label class="visually-hidden" for="app-search">Поиск диаграмм</label>
        <input id="app-search" class="app-topbar__search-input" type="search" name="search" placeholder="Поиск диаграмм… Ctrl+K" autocomplete="off" />
        <button type="button" class="app-topbar__search-button" aria-label="Найти">
          <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="9" cy="9" r="5" />
            <path d="M13 13l4 4" />
          </svg>
        </button>
      </div>
      <a class="app-topbar__new" href="welcome.html">
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M10 4v12M4 10h12" />
        </svg>
        <span>Новая диаграмма</span>
      </a>
      <a class="header__lang" href="../en/app/dashboard.html" hreflang="en" lang="en">English</a>
      <div class="auth auth--app" data-auth data-home="../index.html">
        <a class="button auth__button" href="login.html" data-auth-guest>Войти</a>
        <a class="button button--primary auth__button" href="register.html" data-auth-guest>Регистрация</a>
        <span class="auth__name" data-auth-name data-auth-user hidden></span>
        <button type="button" class="button auth__button" data-auth-logout data-auth-user hidden>Выйти</button>
      </div>
      <a class="app-topbar__avatar" href="settings.html" aria-label="Настройки"
        ><svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="10" cy="10" r="2.5" />
          <path d="M10 2.5v2.5M10 15v2.5M2.5 10H5M15 10h2.5M4.7 4.7l1.8 1.8M13.5 13.5l1.8 1.8M4.7 15.3l1.8-1.8M13.5 6.5l1.8-1.8" /></svg
      ></a>
    </header>

    <nav class="app-nav" aria-label="Разделы приложения">
      <ul class="app-nav__list">
        <li class="app-nav__item">
          <a class="app-nav__link" href="dashboard.html" data-section="mine" aria-current="page">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 10l7-6 7 6M5 9v7h10V9" />
            </svg>
            <span>Мои проекты</span>
          </a>
        </li>
        <li class="app-nav__item">
          <a class="app-nav__link" href="welcome.html">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 4h14v12H3zM3 8h14M8 8v8" />
            </svg>
            <span>Шаблоны</span>
          </a>
        </li>
        <li class="app-nav__item">
          <button type="button" class="app-nav__link" data-section="templates">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 3h8l4 4v10H4zM12 3v4h4M7 11h6M7 14h4" />
            </svg>
            <span>Мои шаблоны</span>
          </button>
        </li>
        <li class="app-nav__item">
          <button type="button" class="app-nav__link" data-section="shared">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="7" cy="7" r="3" />
              <path d="M2 16c0-3 2-5 5-5s5 2 5 5M14 4a3 3 0 010 6M16 16c0-2-1-4-3-5" />
            </svg>
            <span>Общие</span>
          </button>
        </li>
        <li class="app-nav__item">
          <button type="button" class="app-nav__link" data-section="trash">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10" />
            </svg>
            <span>Корзина</span>
          </button>
        </li>
      </ul>
    </nav>
    <div class="app-nav__quota">
      <p class="app-nav__quota-text" id="quota-text">Бета: 3 из 5 диаграмм в день</p>
      <progress class="app-nav__progress" aria-labelledby="quota-text" max="5" value="3">3 из 5</progress>
      <p class="app-nav__quota-plan">Pro — без лимитов</p>
    </div>

    <main id="main" class="dashboard">
      <h1 class="dashboard__title">Мои проекты</h1>

      <div class="dashboard__toolbar">
        <div class="filter" role="group" aria-label="Фильтр по нотации">
          <button type="button" class="filter__chip filter__chip--active" data-filter="all" aria-pressed="true">Все</button>
          <button type="button" class="filter__chip" data-filter="bpmn" aria-pressed="false">BPMN</button>
          <button type="button" class="filter__chip" data-filter="erd" aria-pressed="false">ERD <span class="badge">в бете</span></button>
          <button type="button" class="filter__chip" data-filter="dfd" aria-pressed="false">DFD <span class="badge">в бете</span></button>
          <button type="button" class="filter__chip" data-filter="idef0" aria-pressed="false">IDEF0 <span class="badge">в бете</span></button>
        </div>

        <div class="sort">
          <select id="notation-filter" class="sort__select" aria-label="Другие нотации">
            <option value="">Другие нотации…</option>
          </select>
          <label class="visually-hidden" for="project-sort">Сортировка</label>
          <select id="project-sort" class="sort__select" name="sort">
            <option value="newest" selected>Сначала новые</option>
            <option value="oldest">Сначала старые</option>
            <option value="name">По названию</option>
          </select>
        </div>
      </div>

      <button type="button" class="button button--primary" data-new-template hidden>Новый шаблон</button>

      <p class="dashboard__count" id="project-count" role="status" aria-live="polite"></p>

      <ul class="project-list" id="project-list" data-examples></ul>
    </main>
    <script type="module" src="../js/script.js"></script>
  </body>
</html>
