<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="DSLKit projects: filter, search and sort your diagrams." />
    <title>My projects — DSLKit</title>
    <link rel="icon" href="../../images/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="app-page app-page--dashboard">
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="app-topbar">
      <a class="app-topbar__logo" href="../index.html">
        <img class="app-topbar__logo-image" src="../../images/logo.svg" alt="" width="24" height="24" />
        <span class="app-topbar__logo-text">DSLKit</span>
      </a>
      <div class="app-topbar__search" role="search">
        <label class="visually-hidden" for="app-search">Search diagrams</label>
        <input id="app-search" class="app-topbar__search-input" type="search" name="search" placeholder="Search diagrams… Ctrl+K" autocomplete="off" />
        <button type="button" class="app-topbar__search-button" aria-label="Search">
          <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="9" cy="9" r="5" />
            <path d="M13 13l4 4" />
          </svg>
        </button>
      </div>
      <a class="app-topbar__new" href="welcome.html">
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M10 4v12M4 10h12" />
        </svg>
        <span>New diagram</span>
      </a>
      <a class="header__lang" href="../../app/dashboard.html" hreflang="ru" lang="ru">Русский</a>
      <div class="auth auth--app" data-auth data-home="../index.html">
        <a class="button auth__button" href="login.html" data-auth-guest>Sign in</a>
        <a class="button button--primary auth__button" href="register.html" data-auth-guest>Sign up</a>
        <span class="auth__name" data-auth-name data-auth-user hidden></span>
        <button type="button" class="button auth__button" data-auth-logout data-auth-user hidden>Sign out</button>
      </div>
      <a class="app-topbar__avatar" href="settings.html" aria-label="Settings"
        ><svg
          class="icon"
          aria-hidden="true"
          focusable="false"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
          /></svg
      ></a>
    </header>

    <nav class="app-nav" aria-label="Application sections">
      <ul class="app-nav__list">
        <li class="app-nav__item">
          <a class="app-nav__link" href="dashboard.html" data-section="mine" aria-current="page">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 10l7-6 7 6M5 9v7h10V9" />
            </svg>
            <span>My projects</span>
          </a>
        </li>
        <li class="app-nav__item">
          <a class="app-nav__link" href="welcome.html">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 4h14v12H3zM3 8h14M8 8v8" />
            </svg>
            <span>Templates</span>
          </a>
        </li>
        <li class="app-nav__item">
          <button type="button" class="app-nav__link" data-section="templates">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 3h8l4 4v10H4zM12 3v4h4M7 11h6M7 14h4" />
            </svg>
            <span>My templates</span>
          </button>
        </li>
        <li class="app-nav__item">
          <button type="button" class="app-nav__link" data-section="shared">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="7" cy="7" r="3" />
              <path d="M2 16c0-3 2-5 5-5s5 2 5 5M14 4a3 3 0 010 6M16 16c0-2-1-4-3-5" />
            </svg>
            <span>Shared</span>
          </button>
        </li>
        <li class="app-nav__item">
          <button type="button" class="app-nav__link" data-section="trash">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10" />
            </svg>
            <span>Trash</span>
          </button>
        </li>
      </ul>
    </nav>
    <div class="app-nav__quota">
      <p class="app-nav__quota-text" id="quota-text">Beta: 3 of 5 diagrams per day</p>
      <progress class="app-nav__progress" aria-labelledby="quota-text" max="5" value="3">3 of 5</progress>
      <p class="app-nav__quota-plan">Pro — no limits</p>
    </div>

    <main id="main" class="dashboard">
      <h1 class="dashboard__title">My projects</h1>

      <div class="dashboard__toolbar">
        <div class="filter" role="group" aria-label="Filter by notation">
          <button type="button" class="filter__chip filter__chip--active" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="filter__chip" data-filter="bpmn" aria-pressed="false">BPMN</button>
          <button type="button" class="filter__chip" data-filter="erd" aria-pressed="false">ERD <span class="badge">beta</span></button>
          <button type="button" class="filter__chip" data-filter="dfd" aria-pressed="false">DFD <span class="badge">beta</span></button>
          <button type="button" class="filter__chip" data-filter="idef0" aria-pressed="false">IDEF0 <span class="badge">beta</span></button>
        </div>

        <div class="sort">
          <select id="notation-filter" class="sort__select" aria-label="Other notations">
            <option value="">Other notations…</option>
          </select>
          <label class="visually-hidden" for="project-sort">Sort</label>
          <select id="project-sort" class="sort__select" name="sort">
            <option value="newest" selected>Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">By name</option>
          </select>
        </div>
      </div>

      <button type="button" class="button button--primary" data-new-template hidden>New template</button>

      <p class="dashboard__count" id="project-count" role="status" aria-live="polite"></p>

      <ul class="project-list" id="project-list" data-examples></ul>
    </main>
    <script type="module" src="../../js/script.js"></script>
  </body>
</html>
