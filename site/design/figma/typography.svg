<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624"><rect width="960" height="624" fill="#f8f9fc"/><text x="40" y="48" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1f2e" text-anchor="start">Типографика</text><text x="40" y="96" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7285" text-anchor="start">H1 · Inter Bold 48/56</text><text x="40" y="156" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" fill="#1c1f2e" text-anchor="start">Пишите код — получайте диаграмму</text><text x="40" y="208" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7285" text-anchor="start">H2 · Inter Bold 32/40</text><text x="40" y="252" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1f2e" text-anchor="start">Шесть нотаций в одном редакторе</text><text x="40" y="304" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7285" text-anchor="start">H3 · Inter SemiBold 20/28</text><text x="40" y="336" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#1c1f2e" text-anchor="start">Как это работает</text><text x="40" y="388" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7285" text-anchor="start">Body · Inter Regular 16/24</text><text x="40" y="416" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1c1f2e" text-anchor="start">Опишите диаграмму текстом, и холст обновится сразу.</text><text x="40" y="468" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7285" text-anchor="start">Small · Inter Regular 14/20</text><text x="40" y="494" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1c1f2e" text-anchor="start">Бесплатно в бета-версии, до пяти диаграмм в день.</text><text x="40" y="546" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7285" text-anchor="start">Code · JetBrains Mono 14/20</text><text x="40" y="572" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1c1f2e" text-anchor="start">box A0 "Process order" { input: Order }</text></svg>
