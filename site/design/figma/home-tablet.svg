 Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Как это работает</text><rect x="48" y="1208" width="213.33333333333334" height="116" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="68" y="1244" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">1. Пишете код</text><text x="68" y="1272" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Описываете диаграмму</text><text x="68" y="1292" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">на DSL</text><rect x="277.33333333333337" y="1208" width="213.33333333333334" height="116" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="297.33333333333337" y="1244" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">2. Видите схему</text><text x="297.33333333333337" y="1272" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Холст обновляется</text><text x="297.33333333333337" y="1292" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">сразу</text><rect x="506.6666666666667" y="1208" width="213.33333333333334" height="116" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="526.6666666666667" y="1244" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">3. Экспортируете</text><text x="526.6666666666667" y="1272" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">SVG, PNG, PlantUML,</text><text x="526.6666666666667" y="1292" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Mermaid</text><text x="48" y="1404" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-