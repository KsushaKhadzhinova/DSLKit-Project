ите схему</text><text x="36" y="1788" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#a6adc8" text-anchor="start">Холст обновляется сразу</text><rect x="16" y="1836" width="358" height="96" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="1872" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">3. Экспортируете</text><text x="36" y="1900" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#a6adc8" text-anchor="start">SVG, PNG, PlantUML, Mermaid</text><text x="16" y="2012" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#cdd6f4" text-anchor="start">Для кого</text><rect x="16" y="2044" width="358" height="96" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="2080" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">Студентам</text><text x="36" y="2108" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#a6adc8" text-anchor="start">Лабораторные и дипломы</text><rect x="16" y="2156" width="358" height="96" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="2192" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">Разработчикам</text><text x="36" y="2220" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#a6adc8" text-anchor="start">Схемы рядом с кодом</text><rect x="16" y="2268" width="358" height="96" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="2304" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">Аналитикам</text><text x="36" y="2332" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#a6adc8" text-anchor="start">Процессы без рисования</text><text x="16" y="2444" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#cdd6f4" text-anchor="start">Тарифы</text><rect x="16" y="2476" width="358" height="116" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="2512" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">Free</text><text x="36" y="2540" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#a6adc8" text-anchor="start">До 5 диаграмм в день в бета-версии</text><rect x="16" y="2608" width="358" height="116" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="2644" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">Pro</text><text x="36" y="2672" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#a6adc8" text-anchor="start">Без лимитов, история версий, совместная</text><text x="36" y="2692" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#a6adc8" text-anchor="start">работа</text><text x="16" y="2804" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#cdd6f4" text-anchor="start">FAQ</text><rect x="16" y="2836" width="358" height="68" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="2872" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">Что такое DSLKit?</text><rect x="16" y="2920" width="358" height="68" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="2956" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">Нужно ли уметь программировать?</text><rect x="16" y="3004" width="358" height="68" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="3040" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">Какие нотации поддерживаются?</text><rect x="16" y="3088" width="358" height="68" rx="12" fill="#181825" stroke="#313244"/><text x="36" y="3124" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">Сколько это стоит?</text><text x="16" y="3236" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#cdd6f4" text-anchor="start">Записаться в бету</text><text x="16" y="3268" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#cdd6f4" text-anchor="start">Имя</text><rect x="16" y="3276" width="358" height="40" rx="8" fill="#181825" stroke="#313244"/><text x="16" y="3340" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#cdd6f4" text-anchor="start">Эл. почта</text><rect x="16" y="3348" width="358" height="40" rx="8" fill="#181825" stroke="#313244"/><rect x="16" y="3412" width="160" height="44" rx="8" fill="#2563eb"/><text x="96" y="3440" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Отправить</text><rect x="0" y="3500" width="390" height="96" rx="0" fill="#181825" stroke="#313244"/><text x="16" y="3552" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#a6adc8" text-anchor="start">© 2026 DSLKit</text></svg>
