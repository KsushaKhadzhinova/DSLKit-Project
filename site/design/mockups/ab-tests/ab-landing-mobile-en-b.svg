<svg xmlns="http://www.w3.org/2000/svg" width="390" height="4030" viewBox="0 0 390 4030"><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#dde1e9"/></pattern></defs><rect width="390" height="4030" fill="#f8f9fc"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#ffffff" stroke="#dde1e9"/><rect x="16" y="18" width="28" height="28" rx="7" fill="#2563eb"/><text x="30" y="37" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text><text x="54" y="39" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c1f2e" text-anchor="start">DSLKit</text><rect x="334" y="24" width="24" height="2" rx="0" fill="#1c1f2e"/><rect x="334" y="30" width="24" height="2" rx="0" fill="#1c1f2e"/><rect x="334" y="36" width="24" height="2" rx="0" fill="#1c1f2e"/><rect x="234" y="16" width="88" height="32" rx="16" fill="#ffffff" stroke="#dde1e9"/><text x="278" y="37" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4a5068" text-anchor="middle">Dark theme</text><rect x="0" y="64" width="390" height="460" fill="url(#dots)"/><rect x="16" y="90" width="160" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="96" y="110" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#4a5068" text-anchor="middle">Soon: closed beta</text><text x="16" y="180" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1f2e" text-anchor="start" letter-spacing="-0.64">Write code,</text><text x="16" y="220" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1f2e" text-anchor="start" letter-spacing="-0.64">get a diagram</text><text x="16" y="268" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">A web editor for diagrams as code:</text><text x="16" y="296" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">describe a scheme in text in the DSL,</text><text x="16" y="324" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">and DSLKit checks it against the</text><text x="16" y="352" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">notation rules and draws it.</text><rect x="16" y="404" width="320" height="56" rx="8" fill="#2563eb"/><text x="176" y="438.3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Create a diagram</text><text x="16" y="488" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5068" text-anchor="start">The editor opens: code on the left, th</text><rect x="16" y="516" width="142" height="48" rx="8" fill="#ffffff" stroke="#dde1e9"/><text x="87" y="544.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">Join the beta</text><rect x="174" y="516" width="134" height="48" rx="8" fill="#ffffff" stroke="#dde1e9"/><text x="241" y="544.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">How it works</text><rect x="16" y="604" width="358" height="260" rx="16" fill="#ffffff" stroke="#dde1e9"/><text x="40" y="642" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">diagram idef0 &quot;Order process&quot;</text><text x="40" y="666" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">box A0 &quot;Process order&quot; {</text><text x="40" y="690" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">  input: Order</text><text x="40" y="714" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">  output: Invoice</text><text x="40" y="738" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">}</text><rect x="40" y="788" width="96" height="48" rx="6" fill="#e8efff" stroke="#2563eb"/><text x="88" y="817" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">A0</text><rect x="254" y="788" width="96" height="48" rx="6" fill="#e8efff" stroke="#2563eb"/><text x="302" y="817" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">A1</text><rect x="136" y="811" width="118" height="2" rx="0" fill="#2563eb"/><rect x="16" y="912" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="41" y="932" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">UML</text><rect x="76" y="912" width="57" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="104.5" y="932" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">BPMN</text><rect x="143" y="912" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="168" y="932" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">ERD</text><rect x="203" y="912" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="228" y="932" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">DFD</text><rect x="263" y="912" width="64" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="295" y="932" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">IDEF0</text><rect x="16" y="954" width="101" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="66.5" y="974" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">Petri nets</text><text x="16" y="1034" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Six notations in one editor</text><rect x="16" y="1066" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1102" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">UML</text><rect x="36" y="1116" width="67" height="22" rx="11" fill="#e8efff"/><text x="69.5" y="1131" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">in beta</text><text x="36" y="1162" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">A template with sample code</text><rect x="16" y="1192" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1228" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">BPMN</text><rect x="36" y="1242" width="67" height="22" rx="11" fill="#e8efff"/><text x="69.5" y="1257" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">in beta</text><text x="36" y="1288" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">A template with sample code</text><rect x="16" y="1318" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1354" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">ERD</text><rect x="36" y="1368" width="67" height="22" rx="11" fill="#e8efff"/><text x="69.5" y="1383" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">in beta</text><text x="36" y="1414" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">A template with sample code</text><rect x="16" y="1444" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1480" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">DFD</text><rect x="36" y="1494" width="67" height="22" rx="11" fill="#e8efff"/><text x="69.5" y="1509" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">planned</text><text x="36" y="1540" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">A template with sample code</text><rect x="16" y="1570" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1606" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">IDEF0</text><rect x="36" y="1620" width="67" height="22" rx="11" fill="#e8efff"/><text x="69.5" y="1635" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">planned</text><text x="36" y="1666" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">A template with sample code</text><rect x="16" y="1696" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1732" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Petri nets</text><rect x="36" y="1746" width="67" height="22" rx="11" fill="#e8efff"/><text x="69.5" y="1761" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">planned</text><text x="36" y="1792" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">A template with sample code</text><text x="16" y="1878" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">How it works</text><rect x="16" y="1910" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1950" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">1. Write code</text><text x="36" y="1978" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Describe the diagram in the DSL</text><rect x="16" y="2022" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2062" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">2. See the scheme</text><text x="36" y="2090" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">The canvas updates at once</text><rect x="16" y="2134" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2174" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">3. Export</text><text x="36" y="2202" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">SVG, PNG, PlantUML, Mermaid</text><text x="16" y="2302" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Who it is for</text><rect x="16" y="2334" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2374" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Students</text><text x="36" y="2402" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Lab works and theses</text><rect x="16" y="2446" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2486" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Developers</text><text x="36" y="2514" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Diagrams next to code</text><rect x="16" y="2558" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2598" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Analysts</text><text x="36" y="2626" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Processes without drawing</text><text x="16" y="2726" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Pricing</text><rect x="16" y="2758" width="358" height="116" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2798" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1f2e" text-anchor="start">Free</text><text x="36" y="2828" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Up to 5 diagrams a day in the beta</text><rect x="16" y="2890" width="358" height="116" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2930" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1f2e" text-anchor="start">Pro</text><text x="36" y="2960" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">No limits, version history, teamwork</text><rect x="284" y="2906" width="40" height="22" rx="11" fill="#e8efff"/><text x="304" y="2921" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Pro</text><text x="16" y="3078" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Frequently asked questions</text><rect x="16" y="3110" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3150" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">What is DSLKit?</text><text x="342" y="3150" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><rect x="16" y="3194" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3234" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">Do I need to program?</text><text x="342" y="3234" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><rect x="16" y="3278" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3318" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">Which notations are supported?</text><text x="342" y="3318" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><rect x="16" y="3362" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3402" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">How much does it cost?</text><text x="342" y="3402" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><text x="16" y="3502" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Join the beta</text><text x="16" y="3542" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="start">Name</text><rect x="16" y="3550" width="358" height="40" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="16" y="3610" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#dc2626" text-anchor="start">Enter a name of 2 characters or more<