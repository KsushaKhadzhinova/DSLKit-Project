 y="180" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#1c1f2e" text-anchor="start">Write code,</text><text x="48" y="228" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#1c1f2e" text-anchor="start">get a diagram</text><text x="48" y="284" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">A web editor for diagrams as code: describe a scheme in text in the</text><text x="48" y="312" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">DSL, and DSLKit checks it against the notation rules and draws it.</text><rect x="48" y="364" width="672" height="136" rx="24" fill="#2563eb"/><rect x="72" y="388" width="624" height="65" rx="24" fill="#ffffff"/><text x="384" y="427.5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Create a diagram</text><text x="384" y="476" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">The editor opens: code on the left, the diagram on the right</text><rect x="48" y="524" width="142" height="48" rx="8" fill="#2563eb"/><text x="119" y="552.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Join the beta</text><rect x="206" y="524" width="134" height="48" rx="8" fill="#ffffff" stroke="#dde1e9"/><text x="273" y="552.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">How it works</text><rect x="48" y="612" width="672" height="260" rx="16" fill="#ffffff" stroke="#dde1e9"/><text x="72" y="650" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">diagram idef0 &quot;Order process&quot;</text><text x="72" y="674" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">box A0 &quot;Process order&quot; {</text><text x="72" y="698" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">  input: Order</text><text x="72" y="722" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">  output: Invoice</text><text x="72" y="746" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">}</text><rect x="72" y="796" width="96" height="48" rx="6" fill="#e8efff" stroke="#2563eb"/><text x="120" y="825" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">A0</text><rect x="600" y="796" width="96" height="48" rx="6" fill="#e8efff" stroke="#2563eb"/><text x="648" y="825" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">A1</text><rect x="168" y="819" width="432" height="2" rx="0" fill="#2563eb"/><rect x="48" y="920" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="73" y="940" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">UML</text><rect x="108" y="920" width="57" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="136.5" y="940" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">BPMN</text><rect x="175" y="920" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="200" y="940" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">ERD</text><rect x="235" y="920" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="260" y="940" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">DFD</text><rect x="295" y