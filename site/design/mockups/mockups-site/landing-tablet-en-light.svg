er, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">planned</text><text x="412" y="1380" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">A template with sample code</text><text x="48" y="1466" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1f2e" text-anchor="start">How it works</text><rect x="48" y="1498" width="213" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="68" y="1538" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">1. Write code</text><text x="68" y="1566" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Describe the diagram in the DSL</text><rect x="277" y="1498" width="213" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="297" y="1538" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">2. See the scheme</text><text x="297" y="1566" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">The canvas updates at once</text><rect x="506" y="1498" width="213" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="526" y="1538" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">3. Export</text><text x="526" y="1566" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">SVG, PNG, PlantUML, Mermaid</text><text x="48" y="1666" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1f2e" text-anchor="start">Who it is for</text><rect x="48" y="1698" width="213" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="68" y="1738" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Students</t