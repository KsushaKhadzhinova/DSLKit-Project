<svg xmlns="http://www.w3.org/2000/svg" width="498" height="952" viewBox="0 0 498 952"><rect width="498" height="952" fill="#dde1e9"/><rect x="40" y="40" width="418" height="872" rx="48" fill="#111827"/><svg x="54" y="54" width="390" height="844" viewBox="0 0 390 844" preserveAspectRatio="xMidYMin slice"><defs><linearGradient id="cta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="390" height="4078" fill="#f8f9fc"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#ffffff" stroke="#dde1e9"/><rect x="16" y="18" width="28" height="28" rx="7" fill="#2563eb"/><text x="30" y="37" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text><text x="54" y="39" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c1f2e" text-anchor="start">DSLKit</text><rect x="334" y="24" width="24" height="2" rx="0" fill="#1c1f2e"/><rect x="334" y="30" width="24" height="2" rx="0" fill="#1c1f2e"/><rect x="334" y="36" width="24" height="2" rx="0" fill="#1c1f2e"/><rect x="234" y="16" width="88" height="32" rx="16" fill="#ffffff" stroke="#dde1e9"/><text x="278" y="37" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4a5068" text-anchor="middle">Тёмная тема</text><rect x="16" y="90" width="182" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="107" y="110" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#4a5068" text-anchor="middle">Скоро: закрытая бета</text><text x="16" y="180" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1f2e" text-anchor="start">Пишите код —</text><text x="16" y="220" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1f2e" text-anchor="start">получайте диаграмму</text><text x="16" y="268" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">Веб-редактор диаграмм как кода:</text><text x="16" y="296" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">опишите схему текстом на DSL, а</text><text x="16" y="324" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">DSLKit проверит её по правилам</text><text x="16" y="352" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">нотации и нарисует.</text><rect x="16" y="404" width="358" height="136" rx="24" fill="url(#cta)"/><rect x="40" y="428" width="310" height="65" rx="24" fill="#ffffff"/><text x="195" y="467.5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Создать диаграмму</text><text x="195" y="516" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">Откроется редактор: слева код, справа </text><rect x="16" y="564" width="173" height="48" rx="8" fill="#2563eb"/><text x="102.5" y="592.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Записаться в бету</text><rect x="205" y="564" width="165" height="48" rx="8" fill="#ffffff" stroke="#dde1e9"/><text x="287.5" y="592.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">Как это работает</text><rect x="16" y="652" width="358" height="260" rx="16" fill="#ffffff" stroke="#dde1e9"/><text x="40" y="690" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">diagram idef0 &quot;Order process&quot;</text><text x="40" y="714" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">box A0 &quot;Process order&quot; {</text><text x="40" y="738" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">  input: Order</text><text x="40" y="762" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">  output: Invoice</text><text x="40" y="786" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">}</text><rect x="40" y="836" width="96" height="48" rx="6" fill="#e8efff" stroke="#2563eb"/><text x="88" y="865" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">A0</text><rect x="254" y="836" width="96" height="48" rx="6" fill="#e8efff" stroke="#2563eb"/><text x="302" y="865" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">A1</text><rect x="136" y="859" width="118" height="2" rx="0" fill="#2563eb"/><rect x="16" y="960" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="41" y="980" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">UML</text><rect x="76" y="960" width="57" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="104.5" y="980" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">BPMN</text><rect x="143" y="960" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="168" y="980" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">ERD</text><rect x="203" y="960" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="228" y="980" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">DFD</text><rect x="263" y="960" width="64" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="295" y="980" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">IDEF0</text><rect x="16" y="1002" width="101" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="66.5" y="1022" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">Сети Петри</text><text x="16" y="1082" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Шесть нотаций в одном редакторе</text><rect x="16" y="1114" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1150" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">UML</text><rect x="36" y="1164" width="60" height="22" rx="11" fill="#e8efff"/><text x="66" y="1179" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">в бете</text><text x="36" y="1210" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Шаблон с примером кода</text><rect x="16" y="1240" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1276" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">BPMN</text><rect x="36" y="1290" width="60" height="22" rx="11" fill="#e8efff"/><text x="66" y="1305" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">в бете</text><text x="36" y="1336" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Шаблон с примером кода</text><rect x="16" y="1366" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1402" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">ERD</text><rect x="36" y="1416" width="60" height="22" rx="11" fill="#e8efff"/><text x="66" y="1431" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">в бете</text><text x="36" y="1462" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Шаблон с примером кода</text><rect x="16" y="1492" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1528" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">DFD</text><rect x="36" y="1542" width="74" height="22" rx="11" fill="#e8efff"/><text x="73" y="1557" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">в планах</text><text x="36" y="1588" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Шаблон с примером кода</text><rect x="16" y="1618" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1654" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">IDEF0</text><rect x="36" y="1668" width="74" height="22" rx="11" fill="#e8efff"/><text x="73" y="1683" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">в планах</text><text x="36" y="1714" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Шаблон с примером кода</text><rect x="16" y="1744" width="358" height="110" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1780" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Сети Петри</text><rect x="36" y="1794" width="74" height="22" rx="11" fill="#e8efff"/><text x="73" y="1809" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">в планах</text><text x="36" y="1840" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Шаблон с примером кода</text><text x="16" y="1926" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Как это работает</text><rect x="16" y="1958" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1998" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">1. Пишете код</text><text x="36" y="2026" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Описываете диаграмму на DSL</text><rect x="16" y="2070" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2110" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">2. Видите схему</text><text x="36" y="2138" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Холст обновляется сразу</text><rect x="16" y="2182" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2222" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">3. Экспортируете</text><text x="36" y="2250" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">SVG, PNG, PlantUML, Mermaid</text><text x="16" y="2350" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Для кого</text><rect x="16" y="2382" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2422" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Студентам</text><text x="36" y="2450" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Лабораторные и дипломы</text><rect x="16" y="2494" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2534" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Разработчикам</text><text x="36" y="2562" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Схемы рядом с кодом</text><rect x="16" y="2606" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2646" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Аналитикам</text><text x="36" y="2674" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Процессы без рисования</text><text x="16" y="2774" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Тарифы</text><rect x="16" y="2806" width="358" height="116" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2846" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1f2e" text-anchor="start">Free</text><text x="36" y="2876" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">До 5 диаграмм в день в бете</text><rect x="16" y="2938" width="358" height="116" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2978" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1f2e" text-anchor="start">Pro</text><text x="36" y="3008" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Без лимитов, история версий, совместная работа</text><rect x="284" y="2954" width="40" height="22" rx="11" fill="#e8efff"/><text x="304" y="2969" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Pro</text><text x="16" y="3126" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Частые вопросы</text><rect x="16" y="3158" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3198" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">Что такое DSLKit?</text><text x="342" y="3198" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><rect x="16" y="3242" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3282" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">Нужно ли уметь программировать?</text><text x="342" y="3282" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><rect x="16" y="3326" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3366" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">Какие нотации поддерживаются?</text><text x="342" y="3366" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><rect x="16" y="3410" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3450" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">Сколько это стоит?</text><text x="342" y="3450" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><text x="16" y="3550" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Записаться в бету</text><text x="16" y="3590" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="start">Имя</text><rect x="16" y="3598" width="358" height="40" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="16" y="3658" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#dc2626" text-anchor="start">Введите имя от 2 символов</text><text x="16" y="3686" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="start">Эл. почта</text><rect x="16" y="3694" width="358" height="40" rx="8" fill="#ffffff" stroke="#dde1e9"/><text x="28" y="3719" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7285" text-anchor="start">name@example.com</text><text x="16" y="3774" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="start">Нотация</text><rect x="16" y="3782" width="358" height="40" rx="8" fill="#ffffff" stroke="#dde1e9"/><text x="28" y="3807" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7285" text-anchor="start">IDEF0</text><rect x="16" y="3854" width="20" height="20" rx="4" fill="#ffffff" stroke="#dde1e9"/><text x="48" y="3870" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1c1f2e" text-anchor="start">Согласен на обработку данных</text><rect x="16" y="3894" width="160" height="48" rx="8" fill="#2563eb"/><text x="96" y="3922.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Отправить</text><rect x="0" y="3982" width="390" height="96" rx="0" fill="#ffffff" stroke="#dde1e9"/><text x="16" y="4036" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">© 2026 DSLKit. Дипломный проект БГУИР.</text></svg><rect x="201" y="62" width="96" height="6" rx="3" fill="#374151"/></svg>
