<svg xmlns="http://www.w3.org/2000/svg" width="498" height="952" viewBox="0 0 498 952"><rect width="498" height="952" fill="#dde1e9"/><rect x="40" y="40" width="418" height="872" rx="48" fill="#111827"/><svg x="54" y="54" width="390" height="844" viewBox="0 0 390 844" preserveAspectRatio="xMidYMin slice"><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#dde1e9"/></pattern></defs><rect width="390" height="4078" fill="#f8f9fc"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#ffffff" stroke="#dde1e9"/><rect x="16" y="18" width="28" height="28" rx="7" fill="#2563eb"/><text x="30" y="37" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text><text x="54" y="39" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c1f2e" text-anchor="start">DSLKit</text><rect x="334" y="24" width="24" height="2" rx="0" fill="#1c1f2e"/><rect x="334" y="30" width="24" height="2" rx="0" fill="#1c1f2e"/><rect x="334" y="36" width="24" height="2" rx="0" fill="#1c1f2e"/><rect x="234" y="16" width="88" height="32" rx="16" fill="#ffffff" stroke="#dde1e9"/><text x="278" y="37" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4a5068" text-anchor="middle">Dark theme</text><rect x="16" y="90" width="160" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="96" y="110" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#4a5068" text-anchor="middle">Soon: closed beta</text><text x="16" y="180" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1f2e" text-anchor="start">Write code,</text><text x="16" y="220" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1f2e" text-anchor="start">get a diagram</text><text x="16" y="268" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">A web editor for diagrams as code:</text><text x="16" y="296" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">describe a scheme in text in the DSL,</text><text x="16" y="324" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">and DSLKit checks it against the</text><text x="16" y="352" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5068" text-anchor="start">notation rules and draws it.</text><rect x="16" y="404" width="358" height="136" rx="24" fill="#2563eb"/><rect x="40" y="428" width="310" height="65" rx="24" fill="#ffffff"/><text x="195" y="467.5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Create a diagram</text><text x="195" y="516" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">The editor opens: code on the left, th</text><rect x="16" y="564" width="142" height="48" rx="8" fill="#2563eb"/><text x="87" y="592.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Join the beta</text><rect x="174" y="564" width="134" height="48" rx="8" fill="#ffffff" stroke="#dde1e9"/><text x="241" y="592.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">How it works</text><rect x="16" y="652" width="358" height="260" rx="16" fill="#ffffff" stroke="#dde1e9"/><text x="40" y="690" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">diagram idef0 &quot;Order process&quot;</text><text x="40" y="714" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">box A0 &quot;Process order&quot; {</text><text x="40" y="738" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">  input: Order</text><text x="40" y="762" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">  output: Invoice</text><text x="40" y="786" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#1c1f2e" text-anchor="start">}</text><rect x="40" y="836" width="96" height="48" rx="6" fill="#e8efff" stroke="#2563eb"/><text x="88" y="865" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">A0</text><rect x="254" y="836" width="96" height="48" rx="6" fill="#e8efff" stroke="#2563eb"/><text x="302" y="865" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="middle">A1</text><rect x="136" y="859" width="118" height="2" rx="0" fill="#2563eb"/><rect x="16" y="960" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="41" y="980" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">UML</text><rect x="76" y="960" width="57" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="104.5" y="980" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">BPMN</text><rect x="143" y="960" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="168" y="980" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">ERD</text><rect x="203" y="960" width="50" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="228" y="980" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="middle">DFD</text><rect x="263" y="960" width="64" height="30" rx="15" fill="#ffffff" stroke="#dde1e9"/><text x="295" y="980" font-family="Inter, Arial, sans-serif" font-s