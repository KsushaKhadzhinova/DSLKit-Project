sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">A template with sample code</text><text x="16" y="1926" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">How it works</text><rect x="16" y="1958" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="1998" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">1. Write code</text><text x="36" y="2026" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Describe the diagram in the DSL</text><rect x="16" y="2070" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2110" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">2. See the scheme</text><text x="36" y="2138" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">The canvas updates at once</text><rect x="16" y="2182" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2222" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">3. Export</text><text x="36" y="2250" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">SVG, PNG, PlantUML, Mermaid</text><text x="16" y="2350" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Who it is for</text><rect x="16" y="2382" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2422" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Students</text><text x="36" y="2450" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Lab works and theses</text><rect x="16" y="2494" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2534" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Developers</text><text x="36" y="2562" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Diagrams next to code</text><rect x="16" y="2606" width="358" height="96" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2646" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c1f2e" text-anchor="start">Analysts</text><text x="36" y="2674" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Processes without drawing</text><text x="16" y="2774" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Pricing</text><rect x="16" y="2806" width="358" height="116" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2846" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1f2e" text-anchor="start">Free</text><text x="36" y="2876" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">Up to 5 diagrams a day in the beta</text><rect x="16" y="2938" width="358" height="116" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="2978" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1f2e" text-anchor="start">Pro</text><text x="36" y="3008" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5068" text-anchor="start">No limits, version history, teamwork</text><rect x="284" y="2954" width="40" height="22" rx="11" fill="#e8efff"/><text x="304" y="2969" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Pro</text><text x="16" y="3126" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Frequently asked questions</text><rect x="16" y="3158" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3198" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">What is DSLKit?</text><text x="342" y="3198" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><rect x="16" y="3242" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3282" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">Do I need to program?</text><text x="342" y="3282" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><rect x="16" y="3326" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3366" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">Which notations are supported?</text><text x="342" y="3366" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><rect x="16" y="3410" width="358" height="68" rx="12" fill="#ffffff" stroke="#dde1e9"/><text x="36" y="3450" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">How much does it cost?</text><text x="342" y="3450" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5068" text-anchor="start">+</text><text x="16" y="3550" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1f2e" text-anchor="start">Join the beta</text><text x="16" y="3590" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="start">Name</text><rect x="16" y="3598" width="358" height="40" rx="8" fill="#ffffff" stroke="#dc2626"/>