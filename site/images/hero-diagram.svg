      <text x="56" y="98"><tspan fill="#c4a5ff">box</tspan> A0 <tspan fill="#86efac">"Process order"</tspan> {</text>
      <text x="56" y="124">  <tspan fill="#c4a5ff">input</tspan>: Order</text>
