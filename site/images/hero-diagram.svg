      <text x="56" y="254">  <tspan fill="#c4a5ff">input</tspan>: Invoice</text>
      <text x="56" y="280">}</text>
      <text x="56" y="306"><tspan fill="#c4a5ff">arrow</tspan> A0.output -&gt; A1.input</text>
