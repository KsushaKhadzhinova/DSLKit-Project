<svg xmlns="http://www.w3.org/2000/svg" width="809" height="500" viewBox="0 0 809 500" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Редактор DSLKit</title>
  <desc id="hero-desc">Слева код на DSL, справа диаграмма IDEF0 с блоками A0 и A1, строка состояния без ошибок</desc>
