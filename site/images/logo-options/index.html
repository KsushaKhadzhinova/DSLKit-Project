<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Варианты логотипа DSLKit</title><style>

</style></head><body><h1>15 вариантов логотипа DSLKit</h1><p class="lead">Каждый знак нарисован вручную, цвета взяты из палитры сайта. В карточке: крупный знак с названием, размеры 32 и 16 пикселей (вкладка браузера) и вариант на тёмном фоне.</p><div class="grid"><figure class="card"><div class="stage"><span class="mark"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки и узел"><rect width="64" height="64" rx="14" fill="#2563eb"/><path d="M24 14c-6 0-6 4-6 8v4c0 3-2 6-5 6 3 0 5 3 5 6v4c0 4 0 8 6 8M40 14c6 0 6 4 6 8v4c0 3 2 6 5 6-3 0-5 3-5 6v4c0 4 0 8-6 8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="4.5" fill="#16a34a"/></svg></span><span class="word" style="font-family:Inter, system-ui, sans-serif">DSLKit</span></div><div class="small"><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки и узел"><rect width="64" height="64" rx="14" fill="#2563eb"/><path d="M24 14c-6 0-6 4-6 8v4c0 3-2 6-5 6 3 0 5 3 5 6v4c0 4 0 8 6 8M40 14c6 0 6 4 6 8v4c0 3 2 6 5 6-3 0-5 3-5 6v4c0 4 0 8-6 8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="4.5" fill="#16a34a"/></svg></span><span class="mark s16"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки и узел"><rect width="64" height="64" rx="14" fill="#2563eb"/><path d="M24 14c-6 0-6 4-6 8v4c0 3-2 6-5 6 3 0 5 3 5 6v4c0 4 0 8 6 8M40 14c6 0 6 4 6 8v4c0 3 2 6 5 6-3 0-5 3-5 6v4c0 4 0 8-6 8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="4.5" fill="#16a34a"/></svg></span><span class="dark"><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки и узел"><rect width="64" height="64" rx="14" fill="#2563eb"/><path d="M24 14c-6 0-6 4-6 8v4c0 3-2 6-5 6 3 0 5 3 5 6v4c0 4 0 8 6 8M40 14c6 0 6 4 6 8v4c0 3 2 6 5 6-3 0-5 3-5 6v4c0 4 0 8-6 8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="4.5" fill="#16a34a"/></svg></span><span class="word" style="font-family:Inter, system-ui, sans-serif">DSLKit</span></span></div><figcaption><b>01. Скобки и узел</b><br>Фигурные скобки как код, точка между ними как узел диаграммы</figcaption></figure><figure class="card"><div class="stage"><span class="mark"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Три узла"><rect width="64" height="64" rx="14" fill="#1e3a8a"/><rect x="10" y="12" width="18" height="14" rx="3" fill="#2563eb"/><rect x="36" y="38" width="18" height="14" rx="3" fill="#16a34a"/><path d="M28 19h12v19" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 45h18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="45" r="3" fill="#ffffff"/></svg></span><span class="word" style="font-family:Georgia, serif">DSLKit</span></div><div class="small"><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Три узла"><rect width="64" height="64" rx="14" fill="#1e3a8a"/><rect x="10" y="12" width="18" height="14" rx="3" fill="#2563eb"/><rect x="36" y="38" width="18" height="14" rx="3" fill="#16a34a"/><path d="M28 19h12v19" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 45h18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="45" r="3" fill="#ffffff"/></svg></span><span class="mark s16"><svg xmlns="http://www.w3.org/2000/svg" width="64" h
