version: 2
# Updates come grouped in one pull request per folder, so the CI queue is not flooded.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /react-app
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-updates:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-updates:
        patterns: ['*']
