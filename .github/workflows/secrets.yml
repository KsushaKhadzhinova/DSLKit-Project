name: Secrets
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Secrets scan of the whole history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, not only the last commit: a key removed later still lives in old commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The binary of a pinned release, checked against the published checksum (the action of the vendor needs a licence key for organisations).
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSL -O "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "$base/gitleaks_${VERSION}_checksums.txt"
          grep "gitleaks_${VERSION}_linux_x64.tar.gz" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose
