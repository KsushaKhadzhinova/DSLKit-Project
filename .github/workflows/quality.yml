name: Quality
# Extra quality gates (lint of the work folders, types, workflows, accessibility, size, flaky tests, Markdown links).
# The main checks stay in ci.yml; this file is separate so that the two can change independently.
on:
  push:
  pull_request:
  workflow_dispatch:
# The token of the workflow may only read the code: a compromised step cannot push or change settings.
permissions:
  contents: read
# A newer push to the same branch cancels the older run of it.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-work-folders:
    name: ESLint ${{ matrix.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder:
          - lab-01-node-server
          - lab-02-sequelize
          - lab-03-auth
          - lab-04-react-state
          - lab-05-react-api
          - lab-06-mongodb
          - lab-07-websocket
          - lab-08-docker
          - pz-01-middleware-ejs
          - pz-02-rest-api
          - pz-03-routing
          - pz-04-context-reducer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the folder
        working-directory: part-2/${{ matrix.folder }}
        run: npm ci
      - name: Lint the folder
        working-directory: part-2/${{ matrix.folder }}
        run: npm run lint


  typecheck:
    name: Types of site/js (tsc --checkJs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck


  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - run: ./actionlint -color


  accessibility:
    name: Accessibility (axe-core, Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Chromium of Playwright instead of Edge.
      E2E_BROWSER: chromium
    steps:
      - name: Set the output folders
        run: |
          echo "E2E_OUT=$RUNNER_TEMP/axe/results" >> "$GITHUB_ENV"
          echo "E2E_SHOTS=$RUNNER_TEMP/axe/screens" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Start the site on port 5173
        run: |
          node tools/serve.js site 5173 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5173/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1
      - name: axe-core on index, editor, dashboard and sign-in, light and dark theme
        run: python testing-course/full/axe-e2e.py
      - name: Build the site and serve dist for Lighthouse
        run: |
          npm run build
          node tools/serve.js dist 5174 > "$RUNNER_TEMP/serve-dist.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5174/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/serve-dist.log"
          exit 1
      - name: Lighthouse budgets (accessibility, best practices, performance)
        run: |
          CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROME_PATH
          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-results
          path: |
            ${{ runner.temp }}/axe
            .lighthouseci
          retention-days: 14


  size-budget:
    name: Bundle size budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node ci/size-budget.mjs dist


  flaky:
    name: Flaky tests (two runs, second shuffled)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node ci/flaky.mjs
