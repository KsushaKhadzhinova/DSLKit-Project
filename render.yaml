# Render Blueprint for the DSLKit course project (branch main).
# Deploy: Render dashboard, New, Blueprint, pick this repository and branch. Render reads this file from the repository root.
# No secret value is stored here: the secrets are generated by Render (generateValue) and can be read in the dashboard, Environment tab.
# The commands match course-project/app/server/package.json and the CMD of docker/backend/Dockerfile.
databases:
  - name: dslkit-db
    databaseName: dslkit
    user: dslkit
    plan: free
    ipAllowList: [] # only services of this Render account reach the database, no access from the internet

services:
  # Express API (Sequelize, JWT). Tables are created by the migrations at every start, the seed is idempotent.
  - type: web
    name: dslkit-api
    runtime: node
    rootDir: course-project/app/server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: dslkit-db
          property: connectionString
      # Render sets NODE_ENV=production by default, and then the server demands DATABASE_SSL=true with a verified certificate chain
      # (DATABASE_SSL_CA). The database of this blueprint is reached only through the private network of the account (ipAllowList is empty),
      # so the block "development" of config/config.js is chosen on purpose. See the README section on deployment.
      - key: NODE_ENV
        value: development
      - key: JWT_SECRET # at least 32 random characters, generated by Render
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CORS_ORIGIN # address of the static site below; change it if Render gives the site another name
        value: https://dslkit-web.onrender.com
      # The first administrator and the demo users are not created here (no ADMIN_EMAIL, no DEMO_USER_PASSWORD): add the variables
      # ADMIN_EMAIL, ADMIN_PASSWORD (10 characters or more) and DEMO_USER_PASSWORD in the dashboard if they are needed, then redeploy.
      - key: TRUST_PROXY # one reverse proxy (the Render load balancer) stands in front of the server
        value: '1'

  # React client (Vite). VITE_API_URL is baked into the bundle at build time.
  - type: web
    name: dslkit-web
    runtime: static
    rootDir: course-project/app/client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL # address of dslkit-api; change it if Render gives the API another name
        value: https://dslkit-api.onrender.com
    routes:
      # Single-page application: unknown paths return index.html (React Router).
      - type: rewrite
        source: /*
        destination: /index.html
