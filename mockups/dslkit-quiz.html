<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg:        #13141a;
  --surface:   #1e1f26;
  --surface2:  #272830;
  --border:    #2e2f3a;
  --accent:    #6c8ef5;
  --accent2:   #a78bfa;
  --green:     #34d399;
  --yellow:    #fbbf24;
  --red:       #f87171;
  --text1:     #e2e4f0;
  --text2:     #9395a8;
  --text3:     #565769;
  --radius:    8px;
  --font:      'Inter', system-ui, sans-serif;
  --mono:      'JetBrains Mono', monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f0f1f8; --surface: #ffffff; --surface2: #f5f6fc;
    --border: #d8dae8; --text1: #1a1b26; --text2: #5c5f7a; --text3: #9395a8;
    color-scheme: light;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text1); }

body {
  display: flex; flex-direction: column;
  padding: 0 16px 32px;
  min-height: 100%;
}

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
  gap: 12px;
  flex-wrap: wrap;
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.logo-badge {
  width: 28px; height: 28px; border-radius: 6px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #fff;
}
.subtitle { font-size: 12px; color: var(--text2); }

/* ── Progress ── */
.progress-wrap {
  margin-bottom: 24px;
}
.progress-info {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--text2); margin-bottom: 6px;
}
.progress-bar-bg {
  height: 4px; background: var(--border); border-radius: 2px;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px; transition: width .35s cubic-bezier(.4,0,.2,1);
}
.block-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--accent); color: #fff;
  font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 20px; margin-bottom: 10px;
  letter-spacing: .04em;
}

/* ── Question card ── */
.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  max-width: 720px;
  margin-left: auto; margin-right: auto;
  width: 100%;
  animation: fadein .2s ease-out;
}
@keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

.q-num {
  font-size: 11px; color: var(--accent); font-weight: 600;
  margin-bottom: 8px; letter-spacing: .06em;
}
.q-text {
  font-size: 15px; font-weight: 600; line-height: 1.5;
  margin-bottom: 4px;
}
.q-meta {
  font-size: 12px; color: var(--text2); margin-bottom: 14px;
}
code { font-family: var(--mono); background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 11px; color: var(--accent2); }

/* ── Options ── */
.options { display: flex; flex-direction: column; gap: 8px; }

.option {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer; position: relative;
  transition: border-color .15s, background .15s;
  font-size: 13px; line-height: 1.4;
}
.option:hover { border-color: var(--accent); background: rgba(108,142,245,.06); }
.option.selected { border-color: var(--accent); background: rgba(108,142,245,.12); }
.option.opt-all  { border-style: dashed; }
.option.opt-none { color: var(--text2); }

.opt-check {
  width: 18px; height: 18px; border-radius: 4px;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: border-color .15s, background .15s;
  margin-top: 1px;
}
.option.radio .opt-check { border-radius: 50%; }
.option.selected .opt-check {
  border-color: var(--accent); background: var(--accent); color: #fff;
}
.opt-label { flex: 1; }
.opt-tag {
  font-size: 10px; color: var(--text3); margin-left: auto;
  white-space: nowrap; padding-left: 8px;
  align-self: center;
}

/* Other input */
.other-wrap { display: none; margin-top: 8px; }
.other-wrap.show { display: block; }
.other-input {
  width: 100%; padding: 8px 10px;
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 6px; color: var(--text1);
  font-size: 13px; font-family: var(--font);
  outline: none;
}
.other-input:focus { border-color: var(--accent); }

/* ── Navigation ── */
.nav {
  display: flex; align-items: center; gap: 10px;
  max-width: 720px; margin: 0 auto;
  justify-content: space-between;
}
.btn-nav {
  padding: 9px 20px; border-radius: var(--radius);
  font-size: 14px; font-weight: 600; font-family: var(--font);
  cursor: pointer; border: none; transition: opacity .15s, transform .1s;
}
.btn-nav:active { transform: scale(.97); }
.btn-back { background: var(--surface2); color: var(--text1); }
.btn-back:hover { background: var(--border); }
.btn-next { background: var(--accent); color: #fff; }
.btn-next:hover { opacity: .9; }
.btn-next:disabled { opacity: .4; cursor: not-allowed; }
.q-counter { font-size: 13px; color: var(--text2); }

/* ── Results ── */
.results { display: none; max-width: 720px; margin: 0 auto; }
.results.show { display: block; }
.results-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.results-sub { color: var(--text2); font-size: 14px; margin-bottom: 20px; }
.result-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
}
.result-block h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: 10px; }
.result-row { margin-bottom: 10px; }
.result-q { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
.result-a { font-size: 13px; color: var(--text1); font-weight: 500; }
.result-a.custom { color: var(--accent2); }

.copy-btn {
  width: 100%; padding: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  font-size: 13px; font-family: var(--font); color: var(--text2);
  margin-top: 8px; transition: background .15s;
}
.copy-btn:hover { background: var(--border); color: var(--text1); }

.restart-btn {
  padding: 10px 24px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius);
  font-size: 14px; font-weight: 600; font-family: var(--font);
  cursor: pointer; margin-top: 16px;
}
.restart-btn:hover { opacity: .9; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>

<div class="header">
  <div>
    <div class="logo">
      <div class="logo-badge">D</div>
      DSLKit · Требования
    </div>
    <div class="subtitle">Ответь на вопросы — получишь точный макет</div>
  </div>

</div>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="progressLabel">Блок 1: Продукт и концепция</span>

  </div>
  <div class="progress-bar-bg">

  </div>
</div>

<div id="questionArea" style="max-width:720px;margin:0 auto;width:100%"></div>

<div class="nav" id="navBar">
  <button class="btn-nav btn-back" id="btnBack" onclick="prevQ()">← Назад</button>
  <span class="q-counter" id="qCounter">1 / 105</span>
  <button class="btn-nav btn-next" id="btnNext" onclick="nextQ()">Далее →</button>
</div>

<div class="results" id="resultsArea">
  <div class="results-title">✓ Готово!</div>
  <div class="results-sub">Все ответы собраны. Ниже — твои требования для DSLKit.</div>
  <div id="resultsContent"></div>
  <button class="copy-btn" onclick="copyResults()">📋 Скопировать все ответы</button>
  <br>
  <button class="restart-btn" onclick="restart()">↩ Пройти заново</button>
</div>

/* ═══════════════════════════════ ENGINE ═══════════════════════════════════ */
let current = 0;
const answers = {};  // index → array of chosen

function buildQ(idx) {
  const q = Qs[idx];
  const isMulti = q.multi;
  const chosen = answers[idx] || [];

  let blockHTML = '';
  const prevBlock = idx > 0 ? Qs[idx-1].b : -1;
  if (q.b !== prevBlock) {
    const blk = BLOCKS[q.b];
    blockHTML = `<div class="block-badge" style="background:${blk.color}">${blk.name}</div>`;
  }

  let optsHTML = q.opts.map((o, oi) => {
    const sel = chosen.includes(oi) ? 'selected' : '';
    const type = isMulti ? '' : 'radio';
    return `<div class="option ${type} ${sel}" onclick="toggleOpt(${idx},${oi},${isMulti})" id="opt-${idx}-${oi}">
      <div class="opt-check">${chosen.includes(oi) ? '✓' : ''}</div>
      <span class="opt-label">${escQ(o)}</span>
      ${oi === q.opts.length - 1 ? '' : ''}
    </div>`;
  }).join('');

  // Add "Всё из этого" (only for multi)
  const allSel = isMulti && chosen.length === q.opts.length ? 'selected' : '';
  if (isMulti) {
    optsHTML += `<div class="option opt-all ${allSel}" onclick="toggleAll(${idx})" id="opt-${idx}-all">
      <div class="opt-check">${allSel ? '✓' : ''}</div>
      <span class="opt-label" style="color:var(--accent)">☑ Всё из этого</span>
    </div>`;
  }

  // Add "Ничего / Другое"
  const noneChosen = chosen.length === 0 && answers[idx] !== undefined && answers[`${idx}_other`];
  const otherVal = answers[`${idx}_other`] || '';
  optsHTML += `<div class="option opt-none ${noneChosen ? 'selected' : ''}" onclick="toggleNone(${idx})" id="opt-${idx}-none">
    <div class="opt-check">${noneChosen ? '✓' : ''}</div>
    <span class="opt-label">✏️ Другое / Пропустить</span>
    <div class="other-wrap ${noneChosen ? 'show' : ''}" id="other-${idx}" onclick="event.stopPropagation()">
      <input class="other-input" placeholder="Опиши своё видение…" value="${escQ(otherVal)}"
        oninput="answers['${idx}_other']=this.value" id="other-input-${idx}">
    </div>
  </div>`;

  return `
    ${blockHTML}
    <div class="question-card">
      <div class="q-num">Вопрос ${idx+1} из ${Qs.length} · ${BLOCKS[q.b].name}</div>
      <div class="q-text">${escQ(q.q)}</div>
      ${q.hint ? `<div class="q-meta">💡 ${escQ(q.hint)}</div>` : ''}
      ${isMulti ? `<div class="q-meta">Можно выбрать несколько</div>` : `<div class="q-meta">Выбери один вариант</div>`}
      <div class="options" id="opts-${idx}">${optsHTML}</div>
    </div>`;
}

function toggleOpt(qIdx, oIdx, isMulti) {
  if (!answers[qIdx]) answers[qIdx] = [];
  const arr = answers[qIdx];
  if (isMulti) {
    const pos = arr.indexOf(oIdx);
    if (pos > -1) arr.splice(pos, 1);
    else arr.push(oIdx);
  } else {
    answers[qIdx] = [oIdx];
  }
  delete answers[`${qIdx}_other`];
  refreshQ(qIdx);
  updateNav();
}

function toggleAll(qIdx) {
  const q = Qs[qIdx];
  const arr = answers[qIdx] || [];
  if (arr.length === q.opts.length) answers[qIdx] = [];
  else answers[qIdx] = q.opts.map((_,i) => i);
  refreshQ(qIdx);
  updateNav();
}

function toggleNone(qIdx) {
  answers[qIdx] = [];
  answers[`${qIdx}_other`] = answers[`${qIdx}_other`] || '';
  refreshQ(qIdx);
  const input = document.getElementById(`other-input-${qIdx}`);
  if (input) setTimeout(() => input.focus(), 50);
  updateNav();
}

function refreshQ(idx) {
  const area = document.getElementById('questionArea');
  area.innerHTML = buildQ(idx);
}

function updateNav() {
  const answered = answers[current] !== undefined && (
    (answers[current] && answers[current].length > 0) ||
    answers[`${current}_other`] !== undefined
  );
  document.getElementById('btnNext').disabled = false; // allow skip
  const pct = Math.round((current / Qs.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressLabel').textContent = BLOCKS[Qs[current].b].name;
  document.getElementById('qCounter').textContent = `${current+1} / ${Qs.length}`;
  document.getElementById('headerProgress').textContent = `Вопрос ${current+1} из ${Qs.length}`;
  document.getElementById('btnBack').disabled = current === 0;
  document.getElementById('btnNext').textContent = current === Qs.length - 1 ? 'Завершить ✓' : 'Далее →';
}

function nextQ() {
  if (current < Qs.length - 1) {
    current++;
    document.getElementById('questionArea').innerHTML = buildQ(current);
    document.getElementById('questionArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
    updateNav();
  } else {
    showResults();
  }
}

function prevQ() {
  if (current > 0) {
    current--;
    document.getElementById('questionArea').innerHTML = buildQ(current);
    updateNav();
  }
}

/* ═════════════════════════════ RESULTS ════════════════════════════════════ */
function showResults() {
  document.getElementById('questionArea').hidden = true;
  document.getElementById('navBar').hidden = true;
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressPct').textContent = '100%';
  document.getElementById('headerProgress').textContent = 'Завершено ✓';

  const res = document.getElementById('resultsArea');
  res.classList.add('show');

  let html = '';
  let lastBlock = -1;

  Qs.forEach((q, idx) => {
    if (q.b !== lastBlock) {
      if (lastBlock !== -1) html += '</div>';
      html += `<div class="result-block"><h3>${BLOCKS[q.b].name}</h3>`;
      lastBlock = q.b;
    }
    html += `<div class="result-row">
      <div class="result-q">Q${idx+1}. ${escQ(q.q)}</div>
      <div class="result-a ${answers[`${idx}_other`] !== undefined ? 'custom' : ''}">
        ${formatAnswer(idx)}
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('resultsContent').innerHTML = html;
}

function formatAnswer(idx) {
  const q = Qs[idx];
  const chosen = answers[idx] || [];
  if (answers[`${idx}_other`] !== undefined) {
    return answers[`${idx}_other`] || '— пропущен —';
  }
  if (chosen.length === 0) return '— не выбрано —';
  return chosen.map(i => q.opts[i]).join(' · ');
}

function copyResults() {
  let text = 'DSLKit — Требования (ответы)\n' + '='.repeat(40) + '\n\n';
  let lastBlock = -1;
  Qs.forEach((q, idx) => {
    if (q.b !== lastBlock) {
      text += '\n' + BLOCKS[q.b].name.toUpperCase() + '\n' + '-'.repeat(30) + '\n';
      lastBlock = q.b;
    }
    text += `Q${idx+1}. ${q.q}\n→ ${formatAnswer(idx)}\n\n`;
  });
  try {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✓ Скопировано!';
      setTimeout(() => btn.textContent = '📋 Скопировать все ответы', 2000);
    });
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
}

function restart() {
  Object.keys(answers).forEach(k => delete answers[k]);
  current = 0;
  document.getElementById('resultsArea').classList.remove('show');
  document.getElementById('questionArea').hidden = false;
  document.getElementById('navBar').hidden = false;
  document.getElementById('questionArea').innerHTML = buildQ(0);
  updateNav();
}

function escQ(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}

/* ══ Init ══ */
document.getElementById('questionArea').innerHTML = buildQ(0);
updateNav();
</script>
