<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSLKit — 100 A/B тестов</title>
<style>
:root{--bg:#f8f9fc;--sf:#fff;--br:#dde1e9;--tx:#1c1f2e;--tx2:#4a5068;--tx3:#6b7285;--ac:#2563eb;--acs:#e8efff;--rt:#16a34a;--er:#dc2626;--wn:#d97706;--kw:#7c3aed;--st:#15803d;--hl:#fff7d6;--sh:0 4px 14px rgba(20,24,40,.14)}
.t-dark{--bg:#1e1e2e;--sf:#181825;--br:#313244;--tx:#cdd6f4;--tx2:#a6adc8;--tx3:#7f849c;--ac:#6d9bff;--acs:#27304d;--rt:#4ade80;--er:#f87171;--wn:#fbbf24;--kw:#c4a5ff;--st:#86efac;--hl:#3a3520;--sh:0 4px 14px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hd{position:sticky;top:0;z-index:100;background:var(--sf);border-bottom:1px solid var(--br);padding:12px 24px}
.hd-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hd h1{font-size:17px;font-weight:700}
.hd p{font-size:12px;color:var(--tx3)}
.hd .sp1{flex:1}
.hbtn{height:30px;padding:0 12px;border:1px solid var(--br);background:var(--sf);border-radius:6px;font-size:12px}
.hbtn:hover{border-color:var(--ac)}
.hbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pg{height:3px;background:var(--br);border-radius:2px;margin-top:10px}
.pg i{display:block;height:100%;width:0;background:var(--ac);border-radius:2px;transition:width .25s}
.lay{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start}.nav{position:sticky;top:84px;max-height:calc(100vh - 84px);overflow:auto;padding:16px 12px;border-right:1px solid var(--br);background:var(--sf);min-height:calc(100vh - 84px)}
.nav a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--tx2);text-decoration:none}
.nav a:hover{background:var(--bg)}
.nav a.cur{background:var(--acs);color:var(--ac);font-weight:600}
.nav a span{color:var(--tx3);font-size:11px}
.ct{padding:24px;max-width:1100px}
.sec h2{font-size:16px;margin:28px 0 12px;display:flex;gap:8px;align-items:baseline}
.sec h2 small{font-weight:400;color:var(--tx3);font-size:12px}
.card{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:16px;margin-bottom:14px}
.card.done{border-color:color-mix(in srgb,var(--ac) 40%,var(--br))}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qn{flex:none;min-width:28px;height:24px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--br);border-radius:6px;font-size:12px;font-weight:600;color:var(--tx2)}
.qt{font-weight:600;font-size:14px}
.tag{display:inline-block;margin-left:8px;font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--br);color:var(--tx3);vertical-align:2px}
.ab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.opt{display:block;min-width:0;border:2px solid var(--br);border-radius:10px;padding:10px;cursor:pointer;background:var(--sf);transition:border-color .12s,background .12s}
.opt:hover{border-color:color-mix(in srgb,var(--ac) 50%,var(--br))}
.opt:has(input:checked){border-color:var(--ac);background:var(--acs)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:focus-visible){outline:2px solid var(--ac);outline-offset:2px}
.ol{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:12.5px;color:var(--tx2)}
.ol b{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--br);font-size:11px;color:var(--tx)}
.opt:has(input:checked) .ol b{background:var(--ac);color:#fff;border-color:var(--ac)}
.hy{margin-top:10px;font-size:12px;color:var(--tx3)}
.foot{margin:32px 0 60px;padding:16px;border:1px dashed var(--br);border-radius:10px;font-size:13px}
.foot pre{margin-top:10px;max-height:220px;overflow:auto;background:var(--bg);padding:10px;border-radius:6px;font-size:12px;white-space:pre-wrap}
@media(max-width:820px){.lay{grid-template-columns:minmax(0,1fr)}.nav{display:none}.ab{grid-template-columns:minmax(0,1fr)}.ct{padding:12px}}

/* ---------- mini UI ---------- */
.pv{position:relative;height:150px;border:1px solid var(--br);border-radius:6px;background:var(--bg);overflow:hidden;font-size:11px;color:var(--tx);user-select:none;pointer-events:none;display:flex;flex-direction:column}
.pv.tall{height:190px}.pv.ph{height:230px}
.pv .ic{flex:none}
.pv .bd{flex:1;position:relative;min-height:0;display:flex}
.pv .col{display:flex;flex-direction:column}
.pv .fl{flex:1;min-width:0}
.mtb{display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;background:var(--sf);border-bottom:1px solid var(--br);flex:none;position:relative}
.mb{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:500;border:1px solid transparent;color:var(--tx2);white-space:nowrap}
.mb.g{border-color:var(--br);color:var(--tx)}
.mb.run{background:var(--rt);color:#fff}
.mb.blue{background:var(--ac);color:#fff}
.mb.dis{background:var(--br);color:var(--tx3)}
.mb.err{background:var(--er);color:#fff}
.mb.ghost{color:var(--tx2)}
.mb.sq{padding:0 5px}
.mb small{font-size:9px;opacity:.75;margin-left:2px}
.sep{width:1px;height:16px;background:var(--br);margin:0 4px}
.gap{width:16px}
.ttl{font-weight:600;color:var(--tx);padding:0 6px}
.bdg{display:inline-block;padding:1px 6px;border-radius:9px;background:var(--acs);color:var(--ac);font-weight:600;font-size:10px}
.bdg.r{background:var(--er);color:#fff}
.bdg.y{background:var(--wn);color:#fff}
.bdg.g{background:var(--rt);color:#fff}
.tgl{display:inline-flex;align-items:center;gap:5px;color:var(--tx2)}
.tgl i{width:24px;height:14px;border-radius:7px;background:var(--br);position:relative}
.tgl i:after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.15s}
.tgl.on i{background:var(--rt)}.tgl.on i:after{left:12px}
.tip{position:absolute;z-index:5;background:#1c1f2e;color:#fff;padding:3px 7px;border-radius:5px;font-size:10px;white-space:nowrap}
.mnu{position:absolute;z-index:5;min-width:120px;background:var(--sf);border:1px solid var(--br);border-radius:7px;box-shadow:var(--sh);padding:3px}
.mnu div{display:flex;justify-content:space-between;gap:10px;padding:3px 8px;border-radius:4px;color:var(--tx)}
.mnu div.hi{background:var(--acs);color:var(--ac)}
.mnu hr{border:0;border-top:1px solid var(--br);margin:3px 0}
.mnu.dk{background:#1e1e2e;color:#cdd6f4;border-color:#313244}.mnu.dk div{color:#cdd6f4}.mnu.dk div.hi{background:#313244;color:#fff}.mnu.dk hr{border-color:#313244}
.mnu.nat{background:#f1f1f1;border-color:#aaa;border-radius:2px;color:#111}.mnu.nat div{color:#111;border-radius:0}.mnu.nat div.hi{background:#0078d7;color:#fff}
.mdl{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:70%;max-width:260px;background:var(--sf);border:1px solid var(--br);border-radius:9px;box-shadow:var(--sh);padding:10px}
.mdl b{display:block;margin-bottom:4px;font-size:12px}
.mdl p{color:var(--tx2);margin-bottom:8px}
.mdl .bt{display:flex;gap:5px;justify-content:flex-end}
.scrim:before{content:"";position:absolute;inset:0;background:rgba(20,24,40,.28);z-index:4}
.toast{position:absolute;z-index:7;background:#1c1f2e;color:#fff;border-radius:6px;padding:5px 10px;box-shadow:var(--sh);display:flex;gap:6px;align-items:center}
.spin{width:11px;height:11px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.prog{height:2px;background:var(--br);position:relative;flex:none}.prog i{position:absolute;left:0;top:0;height:100%;width:55%;background:var(--ac)}
/* tabs */
.mtabs{display:flex;align-items:flex-end;height:28px;background:var(--bg);border-bottom:1px solid var(--br);flex:none;overflow:hidden;position:relative}
.mt{position:relative;display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 10px;border-right:1px solid var(--br);color:var(--tx3);white-space:nowrap;flex:none}
.mt.act{background:var(--sf);color:var(--tx);box-shadow:inset 0 2px 0 var(--ac)}
.mt .dot{width:7px;height:7px;border-radius:50%;background:var(--wn)}
.mt .x{display:grid;place-items:center;width:15px;height:15px;border-radius:3px;font-style:normal}
.mt .nb{position:absolute;left:0;right:0;bottom:0;height:3px}
.mt.sm{padding:0 6px;max-width:64px;overflow:hidden}
/* code */
.med{flex:1;min-width:0;background:var(--sf);font:11px/16px "JetBrains Mono","Cascadia Mono",Consolas,monospace;padding:6px 0;position:relative;overflow:hidden;color:var(--tx)}
.med.f13{font-size:13px;line-height:19px}.med.f14{font-size:14px;line-height:21px}
.med .ln{display:flex;white-space:pre;position:relative}
.med .ln>i{flex:none;width:28px;text-align:right;padding-right:8px;color:var(--tx3);font-style:normal}
.med.nonum .ln>i{display:none}.med.nonum .ln>span{padding-left:10px}
.med .ln.wv>span{background:linear-gradient(transparent 85%,transparent)}
.med .k{color:var(--kw);font-weight:600}.med .s{color:var(--st);font-weight:400}.med .c{color:var(--tx3);font-style:italic;font-weight:400}
.med .ln.er{background:color-mix(in srgb,var(--er) 12%,transparent)}
.med .wave{text-decoration:underline wavy var(--er);text-underline-offset:2px}
.med .ln.hl{background:var(--hl)}
.med .ln.dirty:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--wn)}
.med .ln.gut:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.med .gh{color:var(--tx3);opacity:.7}
.med .cur{display:inline-block;width:1px;height:1em;background:var(--tx);vertical-align:-2px}
.med .mm{position:absolute;right:0;top:0;bottom:0;width:34px;background:var(--bg);border-left:1px solid var(--br)}
.med .mm i{display:block;height:2px;margin:3px 4px;background:var(--br);border-radius:1px}
.med .bm{background:#ffe27a;color:#000}.med .bb{outline:1px solid var(--ac);outline-offset:0}
.med .pop{position:absolute;z-index:3;background:var(--sf);border:1px solid var(--br);border-radius:6px;box-shadow:var(--sh);font:11px/1.4 Inter,sans-serif;padding:3px}
.med .pop div{padding:2px 8px;border-radius:4px}.med .pop div.hi{background:var(--acs);color:var(--ac)}
/* canvas */
.mcv{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--bg)}
.mcv.dots{background-image:radial-gradient(var(--br) 1px,transparent 1.2px);background-size:12px 12px}
.mcv.lines{background-image:linear-gradient(var(--br) 1px,transparent 1px),linear-gradient(90deg,var(--br) 1px,transparent 1px);background-size:14px 14px}
.nd{position:absolute;width:62px;height:30px;border:1.5px solid var(--tx2);border-radius:4px;background:var(--sf);display:grid;place-items:center;font-weight:600;font-size:10px}
.nd.sel{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.nd.bad{border-color:var(--er);border-width:2px}
.nd.blur{filter:blur(1.2px);opacity:.7}
.nd.r8{border-radius:9px}
.mcv svg.ed{position:absolute;inset:0;width:100%;height:100%}
.el{position:absolute;font-size:9px;background:var(--bg);padding:0 3px;color:var(--tx2)}
.zc{position:absolute;display:flex;flex-direction:column;border:1px solid var(--br);border-radius:6px;background:var(--sf);overflow:hidden}
.zc span{padding:3px 6px;text-align:center;border-bottom:1px solid var(--br)}.zc span:last-child{border:0}
.mmap{position:absolute;width:44px;height:30px;border:1px solid var(--br);background:var(--sf);border-radius:4px}
.mmap i{position:absolute;border:1px solid var(--ac);background:var(--acs)}
/* status / panels */
.msb{display:flex;align-items:center;gap:12px;height:22px;padding:0 10px;background:var(--sf);border-top:1px solid var(--br);color:var(--tx2);font-size:10.5px;flex:none;white-space:nowrap}
.msb.tall{height:28px}.msb.alt{background:var(--bg)}
.mpn{background:var(--sf);border-top:1px solid var(--br);flex:none}
.mpn .h{display:flex;gap:10px;padding:4px 8px;border-bottom:1px solid var(--br);font-weight:600;color:var(--tx2)}
.mpn .r{display:flex;gap:6px;align-items:center;padding:3px 8px;border-bottom:1px solid color-mix(in srgb,var(--br) 60%,transparent)}
.mpn .r.hi{background:var(--acs)}
.er-c{color:var(--er)}.wn-c{color:var(--wn)}.ok-c{color:var(--rt)}.mut{color:var(--tx3)}
.side{width:90px;flex:none;background:var(--sf);border-right:1px solid var(--br);padding:6px}
.side.l{border-right:0;border-left:1px solid var(--br)}
.card2{background:var(--sf);border:1px solid var(--br);border-radius:6px;padding:6px 8px}
.ph-frame{width:104px;height:100%;margin:0 auto;border:2px solid var(--tx2);border-radius:14px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph-frame .mtb{height:24px}
.ph-frame .msb{height:34px;justify-content:space-around;gap:0}
.ph-frame .med{font-size:8px;line-height:11px}.ph-frame .med .ln>i{width:14px;padding-right:4px}
.ph-frame .mb{height:18px;padding:0 5px;font-size:9px}
.pv .set-r{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--br)}
.skel{height:6px;border-radius:3px;background:var(--br);margin:4px 0}
.fade1,.fade2,.fade3{animation:fin 2.4s infinite both}.fade2{animation-delay:.4s}.fade3{animation-delay:.8s}
@keyframes fin{0%,15%{opacity:0;transform:scale(.9)}35%,100%{opacity:1;transform:none}}

</style>
</head>
<body>
<header class="hd">
  <div class="hd-row">
    <div><h1>DSLKit — 100 A/B тестов интерфейса</h1><p>Кликните по макету, который нравится больше. Ответы сохраняются автоматически.</p></div>
    <div class="sp1"></div>
    <span class="hy" style="margin:0">Отвечено <b id="cnt">0 / 100</b> · A: <b id="a">0</b> · B: <b id="b">0</b></span>
    <button class="hbtn" id="todo">Только без ответа</button>
    <button class="hbtn" id="theme">☀ Светлая</button>
    <button class="hbtn" id="copy">Скопировать итог</button>
    <button class="hbtn" id="dl">Скачать .md</button>
    <button class="hbtn" id="reset">Сбросить</button>
  </div>
  <div class="pg"><i id="pg"></i></div>
</header>
<div class="lay">
  <nav class="nav" id="nav"></nav>
  <main class="ct" id="ct"></main>
</div>
<script>

<script>
const KEY='dslkit-ab-v2';
let ans={};try{ans=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}};
try{if(localStorage.getItem(KEY+'-theme')==='dark')document.documentElement.classList.add('t-dark')}catch(e){}
const secs=[...new Set(Q.map(q=>q.sec))];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function card(q){
 let pr;try{pr=P[q.n]()}catch(e){console.error('preview',q.n,e);pr=['<div class="pv"></div>','<div class="pv"></div>']}
 const opt=(k,i,t)=>`<label class="opt">${pr[i]}<span class="ol"><b>${k.toUpperCase()}</b><span>${esc(t)}</span></span><input type="radio" name="q${q.n}" value="${k}"${ans[q.n]===k?' checked':''}></label>`;
 return `<article class="card${ans[q.n]?' done':''}" id="q${q.n}"><div class="qh"><span class="qn">${q.n}</span><div class="qt">${esc(q.q)}<span class="tag">${esc(q.tag)}</span></div></div><div class="ab">${opt('a',0,q.a)}${opt('b',1,q.b)}</div>${q.h?`<div class="hy">${esc(q.h)}</div>`:''}</article>`}
function render(){
 $('#nav').innerHTML=secs.map((s,i)=>{const qs=Q.filter(q=>q.sec===s);return `<a href="#s${i}" data-s="s${i}">${esc(s)}<span id="nc${i}">0/${qs.length}</span></a>`}).join('');
 $('#ct').innerHTML=secs.map((s,i)=>{const qs=Q.filter(q=>q.sec===s);return `<section class="sec" id="s${i}"><h2>${esc(s)} <small>${qs[0].n}–${qs[qs.length-1].n}</small></h2>${qs.map(card).join('')}</section>`}).join('')+'<div class="foot" id="foot"></div>';
 stats();
}
function stats(){
 const n=Object.keys(ans).length,a=Object.values(ans).filter(v=>v==='a').length;
 $('#cnt').textContent=n+' / '+Q.length;$('#a').textContent=a;$('#b').textContent=n-a;
 $('#pg').style.width=(n/Q.length*100)+'%';
 secs.forEach((s,i)=>{const qs=Q.filter(q=>q.sec===s);const e=document.getElementById('nc'+i);if(e)e.textContent=qs.filter(q=>ans[q.n]).length+'/'+qs.length});
 const f=$('#foot');if(f)f.innerHTML=n===Q.length?'Готово! Все '+Q.length+' ответов собраны. Нажмите «Скопировать итог» или «Скачать .md».':'Осталось ответить: '+(Q.length-n)+'. Ответы сохраняются в браузере автоматически.';
}
function summary(){
 const rows=Q.map(q=>{const v=ans[q.n];return `| ${q.n} | ${q.sec} | ${q.q.replace(/\|/g,'/')} | ${v?v.toUpperCase()+': '+(v==='a'?q.a:q.b).replace(/\|/g,'/'):'—'} |`});
 return '# DSLKit — результаты A/B тестов\n\nОтвечено: '+Object.keys(ans).length+' из '+Q.length+'\n\n| № | Раздел | Вопрос | Выбор |\n|---|---|---|---|\n'+rows.join('\n')+'\n'}
document.addEventListener('change',e=>{
 const t=e.target;if(t.type!=='radio')return;
 const n=+t.name.slice(1);ans[n]=t.value;persist();t.closest('.card').classList.add('done');stats()});
$('#theme').onclick=()=>{const d=document.documentElement.classList.toggle('t-dark');try{localStorage.setItem(KEY+'-theme',d?'dark':'light')}catch(e){}$('#theme').textContent=d?'☾ Тёмная':'☀ Светлая'};
$('#todo').onclick=()=>{const on=$('#todo').classList.toggle('on');document.querySelectorAll('.card.done').forEach(c=>c.style.display=on?'none':'')};
$('#copy').onclick=async()=>{const s=summary();try{await navigator.clipboard.writeText(s);$('#copy').textContent='Скопировано ✓'}catch(e){prompt('Скопируйте текст:',s)}setTimeout(()=>$('#copy').textContent='Скопировать итог',1800)};
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([summary()],{type:'text/markdown'}));a.download='dslkit-ab-results.md';a.click()};
$('#reset').onclick=()=>{if(confirm('Сбросить все ответы?')){ans={};persist();render();observe()}};
function observe(){
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('cur',a.dataset.s===e.target.id))}}),{rootMargin:'-90px 0px -70% 0px'});
 document.querySelectorAll('.sec').forEach(s=>io.observe(s))}
render();observe();

</script>
</body>
