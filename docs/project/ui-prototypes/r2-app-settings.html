<main class="main " id="main">
<div class="set"><nav class="set__nav" aria-label="Разделы настроек"><ul><li class="is-on">Редактор</li><li>Холст</li><li>Тема</li><li>Горячие клавиши</li><li>AI и интеграции</li><li>Аккаунт и тариф</li></ul></nav>
<div class="set__body"><h1>Настройки · Редактор</h1>
<section class="card2"><h2>Код</h2><label class="row"><span>Размер шрифта кода</span><select><option>13 px</option><option>14 px</option><option>16 px</option></select></label><label class="row"><span>Номера строк</span><input type="checkbox" class="sw" checked></label><label class="row"><span>Перенос строк</span><input type="checkbox" class="sw"></label><label class="row"><span>Автодополнение</span><select><option>По первому символу</option><option>Выключено</option></select></label><label class="row"><span>Автосохранение</span><input type="checkbox" class="sw" checked></label></section>
<section class="card2"><h2>Холст</h2><label class="row"><span>Сетка холста</span><select><option>Точки</option><option>Линии</option><option>Нет</option></select></label><label class="row"><span>Направляющие и отступы</span><input type="checkbox" class="sw" checked></label></section>
<section class="card2"><h2>Движок генерации диаграмм</h2><div class="opts"><label class="opt"><input type="radio" name="e"><span>Kroki · Graphviz</span></label><label class="opt"><input type="radio" name="e"><span>Kroki · Mermaid</span></label><label class="opt"><input type="radio" name="e"><span>Kroki · PlantUML</span></label><label class="opt"><input type="radio" name="e" checked><span>Собственный движок (в браузере)</span></label></div></section>
<section class="card2"><h2>Тема</h2><div class="opts opts--3"><label class="opt opt--theme"><input type="radio" name="t"><span><i class="sw-l"></i>Светлая</span></label><label class="opt opt--theme"><input type="radio" name="t" checked><span><i class="sw-d"></i>Тёмная</span></label><label class="opt opt--theme"><input type="radio" name="t"><span><i class="sw-a"></i>Авто</span></label></div></section></div></div>
</main>
</body>
</html>
