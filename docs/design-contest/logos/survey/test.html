<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест знаков DSLKit</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:20px;color:#14161f;background:#fff7ed}
h1{font-size:20px}button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid #14161f;background:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.p{background:#14161f;color:#fff}.c{text-align:center}.sl{display:grid;grid-template-columns:90px 1fr 90px;gap:8px;align-items:center;margin:10px 0;font-size:14px}
input[type=text],textarea{width:100%;font:inherit;padding:8px;box-sizing:border-box}.big{font-size:28px;margin:30px 0;min-height:44px}
.opt{display:inline-block;margin:6px;padding:8px;border:2px solid transparent;border-radius:10px;background:#fff;cursor:pointer}.opt.on{border-color:#ff5a36}
small{color:#555}
</style></head><body><div id="app"></div>
<script>
var I='#14161f',A='#ff5a36',W='#ffffff';
function rot(s,d){return '<g transform="rotate('+d+' 32 32)">'+s+'</g>'}
var L={
 pin:function(){var b='<rect x="8" y="9" width="28" height="13" rx="5" ';return b+'fill="'+A+'"/>'+rot(b+'fill="'+I+'"/>',90)+rot(b+'fill="'+I+'"/>',180)+rot(b+'fill="'+I+'"/>',270)+'<circle cx="32" cy="32" r="5" fill="'+W+'"/>'},
 pinArrow:function(){var b='<path d="M8 9H30L38 15.5L30 22H8Z" stroke-linejoin="round" stroke-width="2" ';return b+'fill="'+A+'" stroke="'+A+'"/>'+rot(b+'fill="'+I+'" stroke="'+I+'"/>',90)+rot(b+'fill="'+I+'" stroke="'+I+'"/>',180)+rot(b+'fill="'+I+'" stroke="'+I+'"/>',270)},
 pinDrag:function(){return '<rect x="6" y="6" width="22" height="22" rx="7" fill="'+I+'"/><rect x="36" y="36" width="22" height="22" rx="7" fill="'+I+'"/><rect x="6" y="36" width="22" height="22" rx="7" fill="'+I+'"/><rect x="36" y="6" width="22" height="22" rx="7" fill="none" stroke="'+A+'" stroke-width="3" stroke-dasharray="4 4"/><rect x="40" y="2" width="22" height="22" rx="7" fill="'+A+'"/>'},
 st:function(){return '<rect x="3" y="40" width="17" height="19" rx="4" fill="'+I+'"/><rect x="23" y="26" width="17" height="33" rx="4" fill="'+I+'"/><rect x="43" y="10" width="17" height="49" rx="4" fill="'+A+'"/><circle cx="51.5" cy="22" r="3.5" fill="'+W+'"/>'},
 stDrag:function(){return '<rect x="3" y="42" width="16" height="17" rx="4" fill="'+I+'"/><rect x="23" y="30" width="16" height="29" rx="4" fill="'+I+'"/><rect x="43" y="30" width="16" height="29" rx="4" fill="none" stroke="'+A+'" stroke-width="3" stroke-dasharray="4 4"/><rect x="43" y="10" width="16" height="29" rx="4" fill="'+A+'"/>'},
 stArrow:function(){return '<rect x="3" y="44" width="16" height="15" rx="4" fill="'+I+'"/><rect x="23" y="34" width="16" height="25" rx="4" fill="'+I+'"/><rect x="43" y="24" width="16" height="35" rx="4" fill="'+I+'"/><path d="M8 28L38 8M27 7H39V19" fill="none" stroke="'+A+'" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>'},
 hyb:function(){var s='<path d="M4 30V19H12V11H20V4H30V30Z" stroke-linejoin="round" stroke-width="2.5" ';return s+'fill="'+A+'" stroke="'+A+'"/>'+rot(s+'fill="'+I+'" stroke="'+I+'"/>',90)+rot(s+'fill="'+I+'" stroke="'+I+'"/>',180)+rot(s+'fill="'+I+'" stroke="'+I+'"/>',270)}
};
function svg(k,sz){return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 64 64">'+L[k]()+'</svg>'}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var keys=Object.keys(L),seen=shuffle(keys).slice(0,3),R={id:Math.random().toString(36).slice(2,8),when:new Date().toISOString(),logos:{}},step=0,app=document.getElementById('app');
var SD=[['серьёзный','игривый'],['традиционный','новый'],['мягкий','строгий'],['дешёвый','дорогой'],['простой','сложный'],['человечный','машинный']];
var WORDS=['надёжный','детский','быстрый','строгий','дружелюбный','сложный','современный','скучный'];
function html(h){app.innerHTML=h}
function intro(){html('<h1>Короткий тест знаков (5 минут)</h1><p>Вы увидите три знака по очереди. Отвечайте быстро, как чувствуете. Правильных ответов нет. Про продукт мы скажем только: это сайт, где пишешь текст и получаешь схемы.</p><button class="p" id="go">Начать</button>');document.getElementById('go').onclick=function(){next()}}
var queue=[];function build(){seen.forEach(function(k){queue.push(['show',k],['said',k],['sd',k],['words',k],['price',k])});queue.push(['recall'],['done'])}
function next(){var q=queue[step++];if(!q)return;({show:show,said:said,sd:sd,words:words,price:price,recall:recall,done:done})[q[0]](q[1])}
function show(k){R.logos[k]={};html('<div class="c"><p>Смотрите на знак</p>'+svg(k,200)+'<p id="t">5</p></div>');var n=5,t=setInterval(function(){n--;var e=document.getElementById('t');if(e)e.textContent=n;if(n<=0){clearInterval(t);next()}},1000)}
function said(k){html('<h1>Что вы запомнили?</h1><p>Знак исчез. Чем, по-вашему, занимается компания с таким знаком? Одной фразой.</p><input type="text" id="a"><p><button class="p" id="ok">Дальше</button></p>');document.getElementById('ok').onclick=function(){R.logos[k].said=document.getElementById('a').value;next()}}
function sd(k){html('<h1>Знак снова</h1><div class="c">'+svg(k,110)+'</div>'+SD.map(function(p,i){return '<div class="sl"><span>'+p[0]+'</span><input type="range" min="1" max="7" value="4" id="s'+i+'"><span style="text-align:right">'+p[1]+'</span></div>'}).join('')+'<button class="p" id="ok">Дальше</button>');document.getElementById('ok').onclick=function(){R.logos[k].sd=SD.map(function(p,i){return +document.getElementById('s'+i).value});next()}}
function words(k){var w=shuffle(WORDS),i=0,res=[];R.logos[k].words=res;html('<h1>Быстро!</h1><div class="c">'+svg(k,90)+'<div class="big" id="w"></div><button class="p" id="y">Подходит (J)</button><button id="n">Не подходит (F)</button></div>');var t0;
 function show1(){if(i>=w.length){document.removeEventListener('keydown',kd);next();return}document.getElementById('w').textContent='…';setTimeout(function(){document.getElementById('w').textContent=w[i];t0=performance.now()},450)}
 function ans(v){if(!t0)return;res.push({w:w[i],fit:v,ms:Math.round(performance.now()-t0)});t0=0;i++;show1()}
 function kd(e){if(e.key=='j'||e.key=='о')ans(1);if(e.key=='f'||e.key=='а')ans(0)}
 document.addEventListener('keydown',kd);document.getElementById('y').onclick=function(){ans(1)};document.getElementById('n').onclick=function(){ans(0)};show1()}
function price(k){html('<h1>Цена</h1><div class="c">'+svg(k,90)+'</div><p>Сколько в месяц было бы нормально платить за сервис с таким знаком?</p><input type="range" min="0" max="30" value="5" id="p"><p id="pv">5 $</p><button class="p" id="ok">Дальше</button>');document.getElementById('p').oninput=function(){document.getElementById('pv').textContent=this.value+' $'};document.getElementById('ok').onclick=function(){R.logos[k].price=+document.getElementById('p').value;next()}}
function recall(){var opts=shuffle(keys.filter(function(k){return seen.indexOf(k)<0}).slice(0,3).concat(seen));html('<h1>Какие знаки вы видели в начале?</h1><p>Отметьте три.</p><div id="o">'+opts.map(function(k){return '<span class="opt" data-k="'+k+'">'+svg(k,70)+'</span>'}).join('')+'</div><button class="p" id="ok">Готово</button>');
 document.getElementById('o').onclick=function(e){var s=e.target.closest('.opt');if(s)s.classList.toggle('on')};
 document.getElementById('ok').onclick=function(){R.recall=Array.prototype.map.call(document.querySelectorAll('.opt.on'),function(e){return e.dataset.k});next()}}
function done(){try{localStorage.setItem('dslkit-logo-'+R.id,JSON.stringify(R))}catch(e){}html('<h1>Спасибо!</h1><p>Скопируйте текст ниже и отправьте организатору.</p><textarea rows="8" id="j" readonly>'+JSON.stringify(R)+'</textarea><p><button class="p" id="cp">Скопировать</button></p>');document.getElementById('cp').onclick=function(){var t=document.getElementById('j');t.select();try{document.execCommand('copy')}catch(e){}}}
build();intro();
</script></body></html>
