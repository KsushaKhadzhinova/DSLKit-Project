<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Логотипы DSLKit, вариант 3</title><style>
:root{--bg:#f8f9fc;--surface:#fff;--text:#1c1f2e;--muted:#4a5068;--border:#dde1e9}
@media (prefers-color-scheme:dark){:root{--bg:#10131c;--surface:#1a1f2e;--text:#eef0f6;--muted:#aab0c4;--border:#2d3448}}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
h1{margin:0 0 4px;font-size:1.6rem}p.lead{margin:0 0 20px;color:var(--muted);max-width:64ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.stage{display:flex;align-items:center;gap:14px;min-height:96px}.big svg{width:88px;height:88px}.word{font:800 1.9rem 'Consolas','Cascadia Mono',monospace;letter-spacing:-.02em}
.small{display:flex;align-items:center;gap:10px;margin:12px 0;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.s48 svg{width:48px;height:48px}.s32 svg{width:32px;height:32px}.s16 svg{width:16px;height:16px}.mark{display:inline-flex}
.blur svg{filter:blur(1.6px)}.inv{margin-left:auto;background:#fff;padding:5px;border-radius:8px;display:inline-flex}.far{display:inline-flex;margin-left:4px}
@media (prefers-color-scheme:dark){.inv{background:#fff}}
figcaption{font-size:.9rem;color:var(--muted)}figcaption b{color:var(--text)}
</style></head><body><h1>Логотипы DSLKit, вариант 3: крупно и заметно</h1><p class="lead">Сплошные заливки, толстые линии и один сильный силуэт. В каждой карточке: знак 88, 48, 32 и 16 пикселей, размытый 32 (как с большого расстояния) и вариант на белой плашке.</p><div class="grid"><figure class="card"><div class="stage"><span class="mark big"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="D-поток"><path d="M6 4h24c20 0 28 12 28 28S50 60 30 60H6z" fill="#2563eb"/><path d="M18 24v16h12v7l16-15-16-15v7z" fill="#ffffff"/><circle cx="12" cy="10" r="3.5" fill="#16a34a"/></svg></span><span class="word">DSLKit</span></div><div class="small"><span class="mark s48"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="D-поток"><path d="M6 4h24c20 0 28 12 28 28S50 60 30 60H6z" fill="#2563eb"/><path d="M18 24v16h12v7l16-15-16-15v7z" fill="#ffffff"/><circle cx="12" cy="10" r="3.5" fill="#16a34a"/></svg></span><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="D-поток"><path d="M6 4h24c20 0 28 12 28 28S50 60 30 60H6z" fill="#2563eb"/><path d="M18 24v16h12v7l16-15-16-15v7z" fill="#ffffff"/><circle cx="12" cy="10" r="3.5" fill="#16a34a"/></svg></span><span class="mark s16"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="D-поток"><path d="M6 4h24c20 0 28 12 28 28S50 60 30 60H6z" fill="#2563eb"/><path d="M18 24v16h12v7l16-15-16-15v7z" fill="#ffffff"/><circle cx="12" cy="10" r="3.5" fill="#16a34a"/></svg></span><span class="far"><span class="mark s32 blur"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="D-поток"><path d="M6 4h24c20 0 28 12 28 28S50 60 30 60H6z" fill="#2563eb"/><path d="M18 24v16h12v7l16-15-16-15v7z" fill="#ffffff"/><circle cx="12" cy="10" r="3.5" fill="#16a34a"/></svg></span></span><span class="inv"><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="D-поток"><path d="M6 4h24c20 0 28 12 28 28S50 60 30 60H6z" fill="#2563eb"/><path d="M18 24v16h12v7l16-15-16-15v7z" fill="#ffffff"/><circle cx="12" cy="10" r="3.5" fill="#16a34a"/></svg></span></span></div><figcaption><b>01. D-поток</b><br>Сплошная D, в её просвете белая стрелка потока: буква и движение данных в одном силуэте</figcaption></figure><figure class="card"><div class="stage"><span class="mark big"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Три примитива"><circle cx="18" cy="18" r="14" fill="#16a34a"/><rect x="34" y="6" width="24" height="24" rx="3" fill="#2563eb"/><path d="M32 34l16 14-16 14-16-14z" fill="#1d4ed8" transform="translate(-0 0)"/><path d="M48 36l12 12-12 12-12-12z" fill="#fbbf24"/></svg></span><span class="word">DSLKit</span></div><div class="small"><span class="mark s48"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Три примитива"><circle cx="18" cy="18" r="14" fill="#16a34a"/><rect x="34" y="6" width="24" height="24" rx="3" fill="#2563eb"/><path d="M32 34l16 14-16 14-16-14z" fill="#1d4ed8" transform="translate(-0 0)"/><path d="M48 36l12 12-12 12-12-12z" fill="#fbbf24"/></svg></span><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Три примитива"><circle cx="18" cy="18" r="14" fill="#16a34a"/><rect x="34" y="6" width="24" height="24" rx="3" fill="#2563eb"/><path d="M32 34l16 14-16 14-16-14z" fill="#1d4ed8" transform="translate(-0 0)"/><path d="M48 36l12 12-12 12-12-12z" fill="#fbbf24"/></svg></span><span class="mark s16"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Три примитива"><circle cx="18" cy="18" r="14" fill="#16a34a"/><rect x="34" y="6" width="24" height="24" rx="3" fill="#2563eb"/><path d="M32 34l16 14-16 14-16-14z" fill="#1d4ed8" transform="translate(-0 0)"/><path d="M48 36l12 12-12 12-12-12z" fill="#fbbf24"/></svg></span><span class="far"><span class="mark s32 blur"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Три примитива"><circle cx="18" cy="18" r="14" fill="#16a34a"/><rect x="34" y="6" width="24" height="24" rx="3" fill="#2563eb"/><path d="M32 34l16 14-16 14-16-14z" fill="#1d4ed8" transform="translate(-0 0)"/><path d="M48 36l12 12-12 12-12-12z" fill="#fbbf24"/></svg></span></span><span class="inv"><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Три примитива"><circle cx="18" cy="18" r="14" fill="#16a34a"/><rect x="34" y="6" width="24" height="24" rx="3" fill="#2563eb"/><path d="M32 34l16 14-16 14-16-14z" fill="#1d4ed8" transform="translate(-0 0)"/><path d="M48 36l12 12-12 12-12-12z" fill="#fbbf24"/></svg></span></span></div><figcaption><b>02. Три примитива</b><br>Круг, квадрат и ромб: три базовые формы нотаций сложены плотным треугольником</figcaption></figure><figure class="card"><div class="stage"><span class="mark big"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки-колонны"><path d="M22 6H8v52h14v-9H17V15h5zM42 6h14v52H42v-9h5V15h-5z" fill="#2563eb"/><path d="M32 18l11 14-11 14-11-14z" fill="#16a34a"/></svg></span><span class="word">DSLKit</span></div><div class="small"><span class="mark s48"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки-колонны"><path d="M22 6H8v52h14v-9H17V15h5zM42 6h14v52H42v-9h5V15h-5z" fill="#2563eb"/><path d="M32 18l11 14-11 14-11-14z" fill="#16a34a"/></svg></span><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки-колонны"><path d="M22 6H8v52h14v-9H17V15h5zM42 6h14v52H42v-9h5V15h-5z" fill="#2563eb"/><path d="M32 18l11 14-11 14-11-14z" fill="#16a34a"/></svg></span><span class="mark s16"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки-колонны"><path d="M22 6H8v52h14v-9H17V15h5zM42 6h14v52H42v-9h5V15h-5z" fill="#2563eb"/><path d="M32 18l11 14-11 14-11-14z" fill="#16a34a"/></svg></span><span class="far"><span class="mark s32 blur"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки-колонны"><path d="M22 6H8v52h14v-9H17V15h5zM42 6h14v52H42v-9h5V15h-5z" fill="#2563eb"/><path d="M32 18l11 14-11 14-11-14z" fill="#16a34a"/></svg></span></span><span class="inv"><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Скобки-колонны"><path d="M22 6H8v52h14v-9H17V15h5zM42 6h14v52H42v-9h5V15h-5z" fill="#2563eb"/><path d="M32 18l11 14-11 14-11-14z" fill="#16a34a"/></svg></span></span></div><figcaption><b>03. Скобки-колонны</b><br>Две толстые скобки как колонны и ромб-узел между ними</figcaption></figure><figure class="card"><div class="stage"><span class="mark big"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Шестигранник-D"><path d="M32 2l26 15v30L32 62 6 47V17z" fill="#2563eb"/><path d="M22 18h10c10 0 14 6 14 14s-4 14-14 14H22zm9 8v12h2c3 0 5-2 5-6s-2-6-5-6z" fill="#ffffff" fill-rule="evenodd"/><circle cx="50" cy="52" r="6" fill="#16a34a"/></svg></span><span class="word">DSLKit</span></div><div class="small"><span class="mark s48"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Шестигранник-D"><path d="M32 2l26 15v30L32 62 6 47V17z" fill="#2563eb"/><path d="M22 18h10c10 0 14 6 14 14s-4 14-14 14H22zm9 8v12h2c3 0 5-2 5-6s-2-6-5-6z" fill="#ffffff" fill-rule="evenodd"/><circle cx="50" cy="52" r="6" fill="#16a34a"/></svg></span><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Шестигранник-D"><path d="M32 2l26 15v30L32 62 6 47V17z" fill="#2563eb"/><path d="M22 18h10c10 0 14 6 14 14s-4 14-14 14H22zm9 8v12h2c3 0 5-2 5-6s-2-6-5-6z" fill="#ffffff" fill-rule="evenodd"/><circle cx="50" cy="52" r="6" fill="#16a34a"/></svg></span><span class="mark s16"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Шестигранник-D"><path d="M32 2l26 15v30L32 62 6 47V17z" fill="#2563eb"/><path d="M22 18h10c10 0 14 6 14 14s-4 14-14 14H22zm9 8v12h2c3 0 5-2 5-6s-2-6-5-6z" fill="#ffffff" fill-rule="evenodd"/><circle cx="50" cy="52" r="6" fill="#16a34a"/></svg></span><span class="far"><span class="mark s32 blur"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Шестигранник-D"><path d="M32 2l26 15v30L32 62 6 47V17z" fill="#2563eb"/><path d="M22 18h10c10 0 14 6 14 14s-4 14-14 14H22zm9 8v12h2c3 0 5-2 5-6s-2-6-5-6z" fill="#ffffff" fill-rule="evenodd"/><circle cx="50" cy="52" r="6" fill="#16a34a"/></svg></span></span><span class="inv"><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Шестигранник-D"><path d="M32 2l26 15v30L32 62 6 47V17z" fill="#2563eb"/><path d="M22 18h10c10 0 14 6 14 14s-4 14-14 14H22zm9 8v12h2c3 0 5-2 5-6s-2-6-5-6z" fill="#ffffff" fill-rule="evenodd"/><circle cx="50" cy="52" r="6" fill="#16a34a"/></svg></span></span></div><figcaption><b>04. Шестигранник-D</b><br>Крупный шестиугольник с вырезанной D: узнаваемый силуэт значка и читаемая буква</figcaption></figure><figure class="card"><div class="stage"><span class="mark big"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="K-стрелка"><rect x="8" y="6" width="13" height="52" rx="3" fill="#2563eb"/><path d="M26 32l22-22h-9l5-4h17v17l-4 5v-9L30 40z" fill="#16a34a"/><path d="M26 30l24 28h-15L22 40z" fill="#2563eb"/></svg></span><span class="word">DSLKit</span></div><div class="small"><span class="mark s48"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="K-стрелка"><rect x="8" y="6" width="13" height="52" rx="3" fill="#2563eb"/><path d="M26 32l22-22h-9l5-4h17v17l-4 5v-9L30 40z" fill="#16a34a"/><path d="M26 30l24 28h-15L22 40z" fill="#2563eb"/></svg></span><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="K-стрелка"><rect x="8" y="6" width="13" height="52" rx="3" fill="#2563eb"/><path d="M26 32l22-22h-9l5-4h17v17l-4 5v-9L30 40z" fill="#16a34a"/><path d="M26 30l24 28h-15L22 40z" fill="#2563eb"/></svg></span><span class="mark s16"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="K-стрелка"><rect x="8" y="6" width="13" height="52" rx="3" fill="#2563eb"/><path d="M26 32l22-22h-9l5-4h17v17l-4 5v-9L30 40z" fill="#16a34a"/><path d="M26 30l24 28h-15L22 40z" fill="#2563eb"/></svg></span><span class="far"><span class="mark s32 blur"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="K-стрелка"><rect x="8" y="6" width="13" height="52" rx="3" fill="#2563eb"/><path d="M26 32l22-22h-9l5-4h17v17l-4 5v-9L30 40z" fill="#16a34a"/><path d="M26 30l24 28h-15L22 40z" fill="#2563eb"/></svg></span></span><span class="inv"><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="K-стрелка"><rect x="8" y="6" width="13" height="52" rx="3" fill="#2563eb"/><path d="M26 32l22-22h-9l5-4h17v17l-4 5v-9L30 40z" fill="#16a34a"/><path d="M26 30l24 28h-15L22 40z" fill="#2563eb"/></svg></span></span></div><figcaption><b>05. K-стрелка</b><br>Сплошная K, у которой верхняя ветвь стала стрелкой вверх-вправо</figcaption></figure><figure class="card"><div class="stage"><span class="mark big"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Развилка-молния"><path d="M4 28h18l14-16h14V4l12 12-12 12v-8H40L28 32l12 12h10v-8l12 12-12 12v-8H36L22 36H4z" fill="#2563eb"/><circle cx="10" cy="32" r="6" fill="#16a34a"/></svg></span><span class="word">DSLKit</span></div><div class="small"><span class="mark s48"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Развилка-молния"><path d="M4 28h18l14-16h14V4l12 12-12 12v-8H40L28 32l12 12h10v-8l12 12-12 12v-8H36L22 36H4z" fill="#2563eb"/><circle cx="10" cy="32" r="6" fill="#16a34a"/></svg></span><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Развилка-молния"><path d="M4 28h18l14-16h14V4l12 12-12 12v-8H40L28 32l12 12h10v-8l12 12-12 12v-8H36L22 36H4z" fill="#2563eb"/><circle cx="10" cy="32" r="6" fill="#16a34a"/></svg></span><span class="mark s16"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Развилка-молния"><path d="M4 28h18l14-16h14V4l12 12-12 12v-8H40L28 32l12 12h10v-8l12 12-12 12v-8H36L22 36H4z" fill="#2563eb"/><circle cx="10" cy="32" r="6" fill="#16a34a"/></svg></span><span class="far"><span class="mark s32 blur"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Развилка-молния"><path d="M4 28h18l14-16h14V4l12 12-12 12v-8H40L28 32l12 12h10v-8l12 12-12 12v-8H36L22 36H4z" fill="#2563eb"/><circle cx="10" cy="32" r="6" fill="#16a34a"/></svg></span></span><span class="inv"><span class="mark s32"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Развилка-молния"><path d="M4 28h18l14-16h14V4l12 12-12 12v-8H40L28 32l12 12h10v-8l12
