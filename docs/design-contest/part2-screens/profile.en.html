<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Details of the current DSLKit user." />
    <title>Current user — DSLKit</title>
    <link rel="icon" href="file:///E:/DSLKit-Project/site/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="file:///E:/DSLKit-Project/site/css/style.css" />
    <link rel="stylesheet" href="extra.css" />
  </head>
  <body class="app-page app-page--dashboard">
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="app-topbar">
      <a class="app-topbar__logo" href="#">
        <img class="app-topbar__logo-image" src="file:///E:/DSLKit-Project/site/images/logo.svg" alt="" width="24" height="24" />
        <span class="app-topbar__logo-text">DSLKit</span>
      </a>
      <div class="app-topbar__tools">
        <a class="header__lang" href="profile.html" hreflang="ru" lang="ru">Русский</a>
        <input class="theme__input" type="checkbox" id="theme-toggle" />
        <label class="theme__button" for="theme-toggle" title="Dark theme"><svg class="theme__icon theme__icon--moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg><svg class="theme__icon theme__icon--sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" /><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg><span class="theme__label">Dark theme</span></label>
        <a class="app-topbar__avatar" href="profile.en.html" aria-label="Profile" data-tip="Profile"><span aria-hidden="true">AK</span></a>
      </div>
    </header>
    <nav class="app-nav" aria-label="Application sections"><ul class="app-nav__list">
        <li class="app-nav__item"><a class="app-nav__link" href="#"><svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10l7-6 7 6M5 9v7h10V9" /></svg><span>My projects</span></a></li>
        <li class="app-nav__item"><a class="app-nav__link" href="profile.en.html" aria-current="page"><svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zM4 17c0-3 2.5-5 6-5s6 2 6 5" /></svg><span>Profile</span></a></li>
        <li class="app-nav__item"><a class="app-nav__link" href="admin-users.en.html"><svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 8a3 3 0 100-6 3 3 0 000 6zM2 17c0-3 2-5 5-5s5 2 5 5M14 4a3 3 0 010 6M16 16c0-2-1-4-3-5" /></svg><span>Users</span></a></li>
      </ul></nav>
    <main id="main" class="dashboard">
      <div class="page-head"><h1 class="page-head__title">Current user</h1></div>
      <div class="profile-grid">
        <section class="panel" aria-labelledby="acc-title">
          <h2 class="panel__title" id="acc-title">Account</h2>
          <dl class="facts">
            <div class="facts__row"><dt>Email</dt><dd>anna@example.com</dd></div>
            <div class="facts__row"><dt>Role</dt><dd><span class="badge">Administrator</span></dd></div>
            <div class="facts__row"><dt>Registered on</dt><dd>October 17, 2026</dd></div>
          </dl>
          <a class="button" href="login.en.html">Sign out</a>
        </section>
        <section class="panel" aria-label="Change password">
          <details class="faq__item" open>
            <summary class="faq__question">Change password</summary>
            <form class="form form--plain faq__answer" action="#" method="post" novalidate>
              <div class="form__field">
            <label class="form__label" for="cur">Current password</label>
            <input id="cur" class="form__input" type="password" name="cur" autocomplete="current-password" />
            
          </div>
              <div class="form__field">
            <label class="form__label" for="nw">New password</label>
            <input id="nw" class="form__input" type="password" name="nw" autocomplete="new-password" aria-describedby="nw-msg" />
            <p class="form__hint" id="nw-msg">8 to 72 bytes, no spaces at the edges.</p>
          </div>
              <div class="form__field">
            <label class="form__label" for="rep">Repeat new password</label>
            <input id="rep" class="form__input" type="password" name="rep" autocomplete="new-password" />
            
          </div>
              <button type="submit" class="button button--primary form__submit">Change password</button>
            </form>
          </details>
        </section>
      </div>
    </main>
  </body>
</html>
