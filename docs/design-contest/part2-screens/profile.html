  <body class="app-page app-page--dashboard">

      <a class="app-topbar__logo" href="#">
        <img class="app-topbar__logo-image" src="file:///E:/DSLKit-Project/site/images/logo.svg" alt="" width="24" height="24" />
        <span class="app-topbar__logo-text">DSLKit</span>

      <div class="app-topbar__tools">
        <a class="header__lang" href="profile.en.html" hreflang="en" lang="en">English</a>

        <label class="theme__button" for="theme-toggle" title="Тёмная тема"><svg class="theme__icon theme__icon--moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg><svg class="theme__icon theme__icon--sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" /><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg><span class="theme__label">Тёмная тема</span></label>

    </header>
    <nav class="app-nav" aria-label="Разделы приложения"><ul class="app-nav__list">
        <li class="app-nav__item"><a class="app-nav__link" href="#"><svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10l7-6 7 6M5 9v7h10V9" /></svg><span>Мои проекты</span></a></li>

    <main id="main" class="dashboard">
      <div class="page-head"><h1 class="page-head__title">Текущий пользователь</h1></div>
      <div class="profile-grid">
        <section class="panel" aria-labelledby="acc-title">
          <h2 class="panel__title" id="acc-title">Аккаунт</h2>
          <dl class="facts">
            <div class="facts__row"><dt>Почта</dt><dd>anna@example.com</dd></div>
            <div class="facts__row"><dt>Роль</dt><dd><span class="badge">Администратор</span></dd></div>
            <div class="facts__row"><dt>Дата регистрации</dt><dd>17 октября 2026</dd></div>
          </dl>
          <a class="button" href="login.html">Выйти</a>
        </section>
        <section class="panel" aria-label="Смена пароля">
          <details class="faq__item" open>
            <summary class="faq__question">Смена пароля</summary>
            <form class="form form--plain faq__answer" action="#" method="post" novalidate>
              <div class="form__field">
            <label class="form__label" for="cur">Текущий пароль</label>
            <input id="cur" class="form__input" type="password" name="cur" autocomplete="current-password" />
            
          </div>
              <div class="form__field">
            <label class="form__label" for="nw">Новый пароль</label>
            <input id="nw" class="form__input" type="password" name="nw" autocomplete="new-password" aria-describedby="nw-msg" />
            <p class="form__hint" id="nw-msg">От 8 до 72 байт, без пробелов по краям.</p>
          </div>
              <div class="form__field">
            <label class="form__label" for="rep">Повторите новый пароль</label>
            <input id="rep" class="form__input" type="password" name="rep" autocomplete="new-password" />
            
          </div>
              <button type="submit" class="button button--primary form__submit">Сменить пароль</button>
            </form>
          </details>
        </section>
      </div>
    </main>
  </body>
